  - type: APIReference
    url: https://app.airmdr.com/docs/api/case_manager.html
- name: AirMDR User Management Service API
  description: >-
    REST API for organizations, users, user groups, sessions, API tokens, passwords, permissions and RBAC templates
    on the AirMDR platform, including organization configuration for investigation depth, credits and features. 60
    operations across 47 paths, authenticated with an API token in the Session cookie.
  humanURL: https://app.airmdr.com/docs/api/user_management_service.html
  baseURL: https://app.airmdr.com/airmdrapi
  tags:
  - Security
  - User Management
  - Identity
