aid: airmdr
name: AirMDR
description: >-
  AirMDR is an AI-native managed detection and response (MDR) provider whose virtual security analyst, Darryl,
  automates alert triage, investigation and response across endpoint, cloud, SaaS, identity, email and network
  tools. The platform ingests alerts from 200+ integrations, runs automated or AI-generated investigation playbooks,
  and produces documented cases; it is sold as a full-service MDR for small security teams, an AI SOC platform for
  MSSPs and enterprise SOCs, and a free plan with 100 alert investigations. Programmatic access is a REST API on
  app.airmdr.com (Case Manager and User Management services, documented in Redoc), authenticated with an API token
  sent as a Session cookie, plus a webhook endpoint for pushing alerts into the platform.
image: https://airmdr.com/hubfs/Favicon.png
url: https://raw.githubusercontent.com/api-evangelist/airmdr/refs/heads/main/apis.yml
