  - type: Documentation
    url: https://docs.airmdr.com/api-reference/apitoken
  - type: APIReference
    url: https://app.airmdr.com/docs/api/user_management_service.html
- name: AirMDR Documentation MCP Server
  description: >-
    Hosted, unauthenticated Streamable-HTTP MCP server on the AirMDR documentation host (Mintlify-operated) exposing
    three tools: search the AirMDR documentation, run read-only queries against a virtual filesystem of the docs
    pages, and submit documentation feedback. It documents the platform; it does not call the Case Manager or User
    Management APIs.
  humanURL: https://docs.airmdr.com/
  baseURL: https://docs.airmdr.com/mcp
