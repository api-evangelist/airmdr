apis:
- name: AirMDR Case Manager API
  description: >-
    REST API for the AirMDR case management surface: create, read, update, list, link, clone and archive cases (v1
    and v2), case findings, evidence, attachments, comments, history and watchers, alert ingestion (the webhook
    entry point), alert catalog and alert types, MITRE tactics, dashboards and SOC/executive metrics, security
    reviews and a Query DSL. 175 operations across 139 paths, authenticated with an API token in the Session cookie.
  humanURL: https://app.airmdr.com/docs/api/case_manager.html
  baseURL: https://app.airmdr.com/airmdrapi
  tags:
  - Security
  - Case Management
  - Alert Triage
  - Incident Response
  - Security Operations
