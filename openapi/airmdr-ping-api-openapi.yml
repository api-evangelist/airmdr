openapi: 3.2.0
info:
  title: Airmdr Ping API
  version: 1.0.0
  description: 'Operations tagged Ping across 2 of this provider''s published API definitions: airmdr-case-manager-openapi.json, airmdr-user-management-service-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: /airmdrapi
tags:
- name: Ping
paths:
  /ping:
    get:
      operationId: getPingAPI
      summary: Ping endpoint
      responses:
        '200':
          description: OK
      tags:
      - Ping
    servers:
    - url: /airmdrapi
components:
  schemas:
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: user friendly error message
    UserManagementResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          type: object
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: Session
x-refined-from:
- airmdr-case-manager-openapi.json
- airmdr-user-management-service-openapi.json
x-tagGroups:
- name: Included APIs
  tags:
  - Case Manager V2
  - Dashboard
  - Alerts
  - Webhooks
  - Query DSL
