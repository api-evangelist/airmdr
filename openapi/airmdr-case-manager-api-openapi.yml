      - Case Manager
      operationId: updateInvestigationTiers
      summary: Override investigation tiers for one or more alert types
      description: 'Sets per-organization investigation tier overrides for one or more

        (provider, alert type) pairs in a single request. Each override takes

        precedence over the cost-trim-derived default tier until removed.'
      parameters:
