openapi: 3.2.0
info:
  title: Airmdr Case Manager API
  version: 1.0.0
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  description: 'Operations tagged Case Manager across 2 of this provider''s published API definitions: airmdr-case-manager-openapi.json, airmdr-case-manager-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /airmdrapi
- url: https://app.airmdr.com/airmdrapi
  description: AirMDR API (relative /airmdrapi in the published spec, resolved against app.airmdr.com per docs.airmdr.com/api-reference/apitoken)
tags:
- name: Case Manager
paths:
  /case:
    post:
      tags:
      - Case Manager
      operationId: createCaseAPI
      summary: create a new case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/{case_uuid}:
    get:
      tags:
      - Case Manager
      operationId: getCaseAPI
      summary: get details of a case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The id of the case to be fetched
        required: true
        schema:
          type: string
      - name: requested_view
        in: query
        description: Requested view of the case
        required: true
        schema:
          $ref: '#/components/schemas/CaseView'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCaseResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Case Manager
      operationId: updateCaseAPI
      summary: update details of a case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The uuid of the case to be updated
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaseRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCaseResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/{case_uuid}/email:
    post:
      tags:
      - Case Manager
      operationId: emailCaseDetailsAPI
      summary: email details of a case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The uuid of the case
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCaseDetailsRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: email sent successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCaseDetailsResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/id/{case_id}:
    get:
      tags:
      - Case Manager
      operationId: getCaseFromIdAPI
      summary: get details of a case from case id
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: case_id
        in: path
        description: The unique case id of the case to be fetched
        required: true
        schema:
          type: string
      - name: requested_view
        in: query
        description: Requested view of the case
        required: true
        schema:
          $ref: '#/components/schemas/CaseView'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCaseResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/list:
    post:
      tags:
      - Case Manager
      operationId: getCasesForOrgAPI
      summary: get case list for an organization based on filter and sort
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: page
        in: query
        description: Page number for paginated results.
        required: true
        schema:
          type: integer
      - name: size
        in: query
        description: Number of results per page.
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseListRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: List of cases retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/bulk:
    delete:
      tags:
      - Case Manager
      operationId: archiveCasesAPI
      summary: archive cases for given uuids
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveCasesRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveCasesResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /v2/case/bulk:
    delete:
      tags:
      - Case Manager
      operationId: archiveCasesAPIV2
      summary: archive cases for given uuids
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: Execution-ID
        in: header
        description: ID of the execution if action is perfomed through a darryl action
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveCasesRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case archived successfully
          content:
