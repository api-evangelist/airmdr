        required: false
        schema:
          type: boolean
          default: false
      security:
      - SessionCookie: []
      responses:
        '200':
          description: SOC performance metrics fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocPerformanceDashboardResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/executive/metrics:
    get:
      tags:
      - Case Manager
