components:
  schemas:
    GenerateCaseScoreRequest:
      type: object
      properties:
        new_scoring_guidelines:
          $ref: '#/components/schemas/ScoringGuidelines'
    SeverityMetrics:
      type: object
      required:
      - alert_count
      properties:
        severity:
          type: integer
        alert_count:
          type: integer
          description: Number of alerts
    CaseAnalyticsDashboardResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/CaseAnalyticsDashboardData'
    CaseStatus:
      type: integer
      enum:
      - 0
      - 1
      - 5
      - 10
      - 20
      - 30
      x-enum-varnames:
      - NewCaseStatus
      - ProgressCaseStaus
      - PendingCaseStaus
      - WaitingForCustomerStatus
      - ContainedCaseStaus
      - ClosedCaseStaus
    CaseListRequest:
      type: object
      required:
      - requested_view
      properties:
        minimal:
          type: boolean
          description: Indicates if data is for minimum details or not
        requested_view:
          $ref: '#/components/schemas/CaseView'
          description: Indicates which view is requested
        filter:
          $ref: '#/components/schemas/CaseFilter'
        sort:
          type: array
          items:
            $ref: '#/components/schemas/CaseSort'
          description: list of sort fields in order
    CaseListResponse:
      type: object
      required:
      - message
      - data
      - total
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/Case'
          description: list of minimal case objects
        total:
          type: integer
    CaseFilter:
      type: object
      properties:
        severity:
          type: array
          items:
            $ref: '#/components/schemas/CaseSeverity'
        status:
          type: array
          items:
            $ref: '#/components/schemas/CaseStatus'
        priority:
          type: array
          items:
            $ref: '#/components/schemas/CasePriority'
        case_id:
          type: string
        name:
          type: string
        description:
          type: string
        reporter:
          type: array
          items:
            type: string
        assignee:
          type: array
          items:
            type: string
        from_modified_date:
          type: integer
          format: int64
        to_modified_date:
          type: integer
          format: int64
        global_search_query:
          type: string
          deprecated: true
        queries:
          type: array
          description: list of queries to search for in all fields. A case will be listed if it matches any of the queries
          items:
            type: string
        archived:
          type: boolean
          description: Flag indicating if archived cases has to be searched or not
    TimeRange:
      type: object
      properties:
