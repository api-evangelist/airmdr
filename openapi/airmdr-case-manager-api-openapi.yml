              schema:
                $ref: '#/components/schemas/ArchiveCasesResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /v2/case/bulk/hard_delete:
    delete:
      tags:
