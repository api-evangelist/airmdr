      - name: Organization-Hosturl
        in: header
        description: The host url of the organization
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteCasesRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: cases deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteCasesResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/{case_identifier}/chat_session/{chat_session_id}/link:
    post:
      tags:
      - Case Manager
      operationId: linkChatSessionToCaseAPI
      summary: Link given chat session to case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: case_identifier
        in: path
        description: Unique identifier (id or uuid) of the case to which chat session will be linked
        schema:
          type: string
      - name: chat_session_id
        in: path
        description: Unique identifier uuid of the chat session to link to the case
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: chat session linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/{case_identifier}/chat_session/{chat_session_id}/unlink:
    post:
      tags:
      - Case Manager
      operationId: unlinkChatSessionToCaseAPI
      summary: Unlink given session from case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: case_identifier
        in: path
        description: Unique identifier (id or uuid) of the case from which session will be unlinked
        schema:
          type: string
      - name: chat_session_id
        in: path
        description: Unique identifier uuid of the session to unlink from case
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: session unlinked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/chat_session/{chat_session_id}:
    get:
      tags:
      - Case Manager
      operationId: getLinkedCasesForSessionAPI
      summary: Get linked cases for given session uuid
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: chat_session_id
        in: path
        description: Unique identifier uuid of the session to unlink from case
        schema:
          type: string
        required: true
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case list fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/{case_identifier}/cases/link:
    post:
      tags:
      - Case Manager
      operationId: linkCasesAPI
      summary: Link given cases in request to case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: case_identifier
        in: path
        description: Unique identifier (id or uuid) of the case to others cases will be linked
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseLinkRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case linked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/{primary_case_identifier}/secondary/case/{secondary_case_identifier}/unlink:
    post:
      tags:
      - Case Manager
      operationId: unlinkCaseAPI
      summary: Unlink given secondary case from primary case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: primary_case_identifier
        in: path
        description: Unique identifier (id or uuid) of the case from which secondary case will be unlinked
        schema:
          type: string
      - name: secondary_case_identifier
        in: path
        description: Unique identifier uuid of the secondary case to unlink from primary case
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case unlinked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/metrics:
    get:
      tags:
      - Case Manager
      operationId: getCaseMetrics
      summary: Retrieve metrics data
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: days
        in: query
        description: Number of days to include in the metrics calculation (optional)
        schema:
          type: integer
          minimum: 1
          default: 7
        required: false
      - name: organization_id
        in: query
        description: Additional org id filter. Only applicable for Airmdr employees. If empty, metrics for all organizations are shown.
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case metrics fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMetricsResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/analytics/metrics:
    get:
      tags:
      - Case Manager
      operationId: getCaseAnalyticsMetrics
      summary: Retrieve case analytics dashboard metrics
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: days
        in: query
        description: Number of days to include in the metrics calculation.
        required: false
        schema:
          type: integer
          minimum: 1
          default: 7
      - name: organization_id
        in: query
        description: Org ID filter. Only applicable for AirMDR employees. If empty, metrics for all accessible organizations are returned.
        required: false
        schema:
          type: string
      - name: created_at_from
        in: query
        description: Start of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: created_at_to
        in: query
        description: End of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: force_refresh
        in: query
        description: When true, bypass any cached result and recompute the metrics.
        required: false
        schema:
          type: boolean
          default: false
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Case analytics metrics fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAnalyticsDashboardResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/soc/metrics:
