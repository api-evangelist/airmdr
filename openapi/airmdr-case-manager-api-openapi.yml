      - SessionCookie: []
      responses:
        '200':
          description: Executive metrics fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutiveDashboardResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /case/metrics/llm/summary:
    get:
      tags:
      - Case Manager
      operationId: getCaseMetricsLLMSummaryAPI
      summary: Based on the parameters, retrieve LLM generated summary for the metrics data
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
