openapi: 3.2.0
info:
  title: Airmdr Alerts API
  version: 1.0.0
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  description: 'Operations tagged Alerts across 2 of this provider''s published API definitions: airmdr-case-manager-openapi.json, airmdr-case-manager-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /airmdrapi
- url: https://app.airmdr.com/airmdrapi
  description: AirMDR API (relative /airmdrapi in the published spec, resolved against app.airmdr.com per docs.airmdr.com/api-reference/apitoken)
tags:
- name: Alerts
paths:
  /alerts:
    post:
      tags:
      - Alerts
      operationId: createAlertsAPI
      summary: Create alerts
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: skip_investigation
        in: query
        description: Flag indicating whether the investigation for the alert should be skipped.
        schema:
          type: boolean
      requestBody:
        description: Request body for creating alerts.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAlertsRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alerts created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alerts/analyze:
    post:
      tags:
      - Alerts
      operationId: analyzeAlertAPI
      summary: Analyze alerts
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: return_partial_data
        in: query
        description: If true, returns whatever fields were identified even if some are missing. If false, returns error if any field is missing.
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        description: Request body for analyzing alerts.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeAlertRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alerts analyzed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAlertResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alerts/export:
    post:
      tags:
      - Alerts
      operationId: exportAlertsAPI
      summary: Export alerts data
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      requestBody:
        description: Request body for list alerts with search and filter.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAlertsRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: A CSV file containing the alerts data
          content:
            text/csv:
              schema:
                type: string
                format: binary
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alerts/{alert_id}:
    get:
      tags:
      - Alerts
      operationId: getAlertAPI
      summary: get the details of an alert
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: alert_id
        in: path
        description: The ID associated with the alert
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Alerts
      operationId: updateAlertAPI
      summary: update the details of an alert
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: alert_id
        in: path
        description: The ID associated with the alert
        schema:
          type: string
      requestBody:
        description: Request body for updating an alert.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alerts/{alert_id}/investigate:
    post:
      tags:
      - Alerts
      operationId: investigateAlertAPI
      summary: process or investigate the alert
      description: investigate or re-investigate the alert
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: alert_id
        in: path
        description: The ID associated with the alert
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert submitted for investigation successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigateAlertResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alerts/{alert_id}/investigate/agentic-preview:
    post:
      tags:
      - Alerts
      operationId: investigateAlertAgenticPreviewAPI
      summary: run the agentic preview investigation for a single alert
      description: Fires the agentic investigation via the beta (preview) service asynchronously and returns immediately. Skips the playbook side entirely and does not create a case (create_case_in_airmdr is hardcoded to false). When the beta call completes successfully, the alert's is_investigated_with_agent flag is set to true.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: alert_id
        in: path
        description: The ID associated with the alert
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '202':
          description: Alert accepted for agentic preview investigation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alerts/bulk/hard_delete:
    delete:
      tags:
      - Alerts
      operationId: bulkHardDeleteAlertsAPI
      summary: delete alerts in bulk
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteAlertsRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alerts deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteAlertsResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alerts/{alert_id}/hard_delete:
    delete:
      tags:
      - Alerts
      operationId: hardDeleteAlertAPI
      summary: delete an alert
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: alert_id
        in: path
        description: The ID associated with the alert
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_types:
    get:
      tags:
      - Alerts
      operationId: listAlertTypesAPI
      summary: Get the list of Alert types
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: alert_provider
        in: query
        description: alert provider filter
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: List of alerts types fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAlertTypesResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_budget_overview:
    get:
      tags:
      - Alerts
      operationId: getAlertBudgetOverview
      summary: Per-organization alert budget vs. actual overview
      description: 'Returns one row per organization the caller can access via RBAC, showing

        the weekly alert budget (`weekly_investigation_limit`) against the actual

        weekly alert volume, whether the org is over budget, and a summary of its

        alert-skip list (how many types are already applied, pending, or awaiting

        approval, plus the next auto-apply date). Powers the overview tab of the

        alert-skip console.


        Actuals are derived from the same daily cost-trim snapshot that backs the

        skip-list detail view, so the two screens reconcile. The `stale` flag

        indicates the snapshot is older than the configured freshness window.'
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: organization_id
        in: query
        description: 'The organization (UUID) whose accessible org set the overview is

          computed for. The response includes one row per organization the

          caller can access from this org via RBAC.

          '
        required: true
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        description: Field to order rows by. Defaults to organization_name.
        schema:
          type: string
          enum:
          - organization_name
          - organization_code
          - actual
          - budget
          - pct_of_budget
          default: organization_name
      - name: sort_order
        in: query
        required: false
        description: Sort direction. Defaults to asc.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: limit
        in: query
        required: false
        description: Maximum number of org rows to return.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: offset
        in: query
        required: false
        description: Row offset for pagination.
        schema:
          type: integer
          minimum: 0
          default: 0
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert budget overview fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertBudgetOverviewResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_skip_list:
    get:
      tags:
      - Alerts
      operationId: getAlertSkipList
      summary: Retrieve one organization's alert-skip list
      description: 'Returns the organization''s alert types as flat rows, each tagged with a

        status (not_skipped / recommended / skipped / excluded), along with the

        org''s weekly alert budget and actual weekly volume.'
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: organization_id
        in: query
        required: true
        description: The organization (UUID) to load the skip list for.
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert skip list fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertSkipListResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_skip_list/apply:
    post:
      tags:
      - Alerts
      operationId: applyAlertSkip
      summary: Apply pending alert-skip entries now (admin only)
      description: 'Immediately transitions the named `pending` skip entries to `applied`,

        bypassing the day-7 auto-apply wait. Restricted to admin/super-admin

        callers. Omitting `items` applies every pending entry for the org. The

        action is audited.'
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSkipLifecycleRequest'
      responses:
        '200':
          description: Pending skip entries applied successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_skip_list/hold:
    post:
      tags:
      - Alerts
      operationId: holdAlertSkip
      summary: Hold pending alert-skip entries past auto-apply (admin only)
      description: 'Marks the named `pending` skip entries as `held`, preventing the day-7

        auto-apply from promoting them until released. Restricted to

        admin/super-admin callers (a hold is also the contract-override lever).

        The action is audited; `reason` is recorded.'
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSkipLifecycleRequest'
      responses:
        '200':
          description: Skip entries held successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alerts_list:
    post:
      tags:
      - Alerts
      operationId: listAlertsAPI
      summary: Get the list of alerts
      description: Get the list of alerts per org
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: page
        in: query
        description: Page number for paginated results.
        schema:
          type: integer
      - name: size
        in: query
        description: Number of results per page.
        schema:
          type: integer
      requestBody:
        description: Request body for list alerts with search and filter.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAlertsRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: List of alerts fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAlertsResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alerts/execution/{execution_id}:
    get:
      tags:
      - Alerts
      operationId: getAlertbyExecutionIDAPI
      summary: get the details of an alert given execution id
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: execution_id
        in: path
        description: The ID associated with the execution for which alert is to be fetched.
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
components:
  schemas:
    AlertsIOC:
      type: object
      properties:
        ip_address:
          type: array
          items:
            type: string
        domain:
          type: array
          items:
            type: string
        username:
          type: array
          items:
            type: string
        location:
          type: array
          items:
            type: string
        hostname:
          type: array
          items:
            type: string
        url:
          type: array
          items:
            type: string
        ioc_fields:
          type: object
    AlertTypeWithProperties:
      type: object
      required:
      - alert_type
      - alert_provider
      - default_severity
      - categories
      - mitre_tactics
      properties:
        alert_type:
          type: string
        alert_provider:
          type: string
        default_severity:
          $ref: '#/components/schemas/AlertTypeSeverity'
        categories:
          type: array
          items:
            type: string
        mitre_tactics:
          type: array
          items:
            type: string
    ListAlertsFilter:
      type: object
      properties:
        global_search_query:
          type: string
        investigation_status:
          type: array
          description: possible values are created, submitted, inprogress, completed, failed
          items:
            type: string
        alert_id:
          type: string
        alert_provider:
          type: string
        alert_providers:
          type: array
          items:
            type: string
        alert_type:
          type: string
        alert_types:
          type: array
          items:
            type: string
        organization_code:
          type: string
        organization_codes:
          type: array
          items:
            type: string
        modified_at_time_range:
          $ref: '#/components/schemas/TimeRange'
        created_at_time_range:
          $ref: '#/components/schemas/TimeRange'
        connection_ids:
          type: array
          items:
            type: string
        fetched_playbook_names:
          type: array
          description: Filter alerts by source playbook names
          items:
            type: string
        investigation_playbook_names:
          type: array
          description: Filter alerts by investigator playbook names
          items:
            type: string
        unresolved:
