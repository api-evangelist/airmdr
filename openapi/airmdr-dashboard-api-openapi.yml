          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocEmailResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /case/analytics/email:
    post:
      tags:
      - Dashboard
      operationId: emailCaseAnalyticsReportAPI
      summary: Email Case Analytics Report
      description: Queues Case Analytics Report email for delivery.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaseAnalyticsEmailRequest'
      responses:
        '200':
          description: Email queued for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAnalyticsEmailResponse'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    OutlierCase:
      type: object
      required:
      - case_id
      - case_uuid
      properties:
        case_id:
          type: string
        case_uuid:
          type: string
        category:
          type: string
        severity:
          type: integer
        assignee_email:
          type: string
        investigation_time_seconds:
          type: integer
          description: Time from alert_acknowledged_at to investigation_completed_at in seconds.
        close_time_seconds:
          type: integer
          description: Time from alert_raised_at to case_closed_at in seconds.
    HostWidgets:
      type: object
      properties:
        repeat_incident_hosts:
          type: array
          items:
            $ref: '#/components/schemas/EntityCount'
          description: Hosts appearing in more than one case.
        hosts_in_malicious_activity:
          type: array
          items:
            $ref: '#/components/schemas/EntityCount'
          description: Hosts appearing in malicious cases.
        multi_vector_targeted_hosts:
          type: array
          items:
            $ref: '#/components/schemas/MultiVectorHost'
          description: Hosts involved in more than one distinct attack type.
    RemediationWidgets:
      type: object
      properties:
        unresolved_actions:
          type: array
          items:
            $ref: '#/components/schemas/CaseActionCount'
          description: Cases ranked by count of actions with status in [0,1,2] (New, Pending, Customer Pending).
        customer_action_cases:
          type: array
          items:
            $ref: '#/components/schemas/CaseActionCount'
          description: Cases ranked by count of actions with status=2 (Customer Pending).
    DashboardSchedule:
      type: object
      required:
      - schedule_id
      - organization_id
      - organization_code
      - name
      - frequency
      - recipients
      - is_enabled
      - frequency_display
      - created_at
      - updated_at
      - created_by
      properties:
        schedule_id:
          type: string
        organization_id:
          type: string
        organization_code:
          type: string
          description: Human-readable org code shown in the schedule list (e.g. ASO).
        name:
          type: string
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        recurrence:
          $ref: '#/components/schemas/ScheduleRecurrence'
          description: Null for send_now schedules.
        recipients:
          type: array
          items:
            type: string
            format: email
          minItems: 1
        is_enabled:
          type: boolean
          description: Whether the schedule is active. False pauses delivery without deleting the schedule.
        frequency_display:
          type: string
          description: Human-readable recurrence summary shown in the list (e.g. "Every Monday at 9:00 AM", "Monthly on the 1st at 8:00 AM").
        created_at:
          type: integer
          format: int64
          description: Unix epoch seconds (UTC).
        updated_at:
          type: integer
          format: int64
          description: Unix epoch seconds (UTC).
        created_by:
          type: string
          description: User ID of the creator.
    CostTrimTotals:
      type: object
      required:
      - alerts
      - investigated
      - escalations
      - efficacy
      properties:
        alerts:
          type: integer
          format: int64
        investigated:
          type: integer
          format: int64
        escalations:
          type: integer
          format: int64
          description: Count of alerts whose linked case was escalated to the customer.
        efficacy:
          type: number
          format: double
          description: Total escalations divided by total alerts.
    CaseAnalyticsEmailRequest:
      type: object
      required:
      - email_ids
      - subject
      - filter
      properties:
        email_ids:
          type: array
          items:
            type: string
          description: List of email addresses to send the report to
        subject:
          type: string
          description: Email subject line. If empty, a default subject will be generated.
        filter:
          $ref: '#/components/schemas/CaseAnalyticsEmailRequestFilter'
          description: Filter parameters for the report
    ListDashboardScheduleExecutionsResponse:
      type: object
      required:
      - executions
      - total
      properties:
        executions:
          type: array
          items:
            $ref: '#/components/schemas/DashboardScheduleExecution'
        total:
          type: integer
          description: Total count of executions for this schedule.
    MetricsAttributes:
      required:
      - mean_metric_total
      - daily_mean_metrics
      - mean_metrics_intervals
      type: object
      properties:
        mean_metric_total:
          type: number
          description: Mean metric value for the total range
        daily_mean_metrics:
          type: object
          additionalProperties:
            type: number
          description: Mean metric values for each day
        mean_metrics_intervals:
          type: object
          additionalProperties:
            type: number
          description: Mean metric values for each interval
    BulkUpdateDashboardScheduleRequest:
      type: object
      required:
      - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/UpdateDashboardScheduleItem'
          minItems: 1
          maxItems: 50
    SocPerformanceDashboardResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/SocPerformanceDashboardData'
    AlertTypeCount:
      type: object
      required:
      - alert_type
      - total
      properties:
        alert_type:
          type: string
        total:
          type: integer
          description: Total cases for this alert type.
        malicious:
          type: integer
          description: Cases with disposition=10 (Malicious).
        false_positive:
          type: integer
          description: Cases with disposition in [1,5] (NoThreatFound + NonMaliciousPositive).
    DetectionWidgets:
      type: object
      properties:
        high_value_detections:
          type: array
          items:
            $ref: '#/components/schemas/AlertTypeCount'
          description: Alert types ranked by malicious case count.
        false_positive_alert_types:
          type: array
          items:
            $ref: '#/components/schemas/AlertTypeCount'
          description: Alert types ranked by false positive case count.
        uninvestigated_alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertTypeCount'
          description: Alert types with no linked case (linked_case_id null and no non-empty case_id in linked_case_executions).
        missing_data:
          type: array
          items:
            $ref: '#/components/schemas/AlertTypeCount'
          description: Alert types where cases have a non-empty confidence.missing_information field, grouped by alert type.
        top_alert_types:
          type: array
          items:
            $ref: '#/components/schemas/AlertTypeCount'
          description: Top 10 alert types ranked by case count within the requested date range.
    ListDashboardSchedulesResponse:
      type: object
      required:
      - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSchedule'
        total:
          type: integer
          description: Total count of schedules available for user.
    ProviderSummary:
      type: object
      required:
      - name
      - display_name
      - logo_url
      - provider_id
      properties:
        name:
          type: string
        display_name:
          type: string
        logo_url:
          type: string
        provider_id:
          type: string
    CaseMetricsResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/CaseMetrics'
          description: case metrics object
    CostTrimSnapshotRow:
      type: object
      required:
      - organization_uuid
      - alert_provider
      - alert_type
      - alerts
      - investigated
      - escalated_to_customer
      properties:
        organization_uuid:
          type: string
        organization_code:
          type: string
        alert_provider:
          type: string
        alert_type:
          type: string
        window_start:
          type: integer
          format: int64
        window_end:
          type: integer
          format: int64
        computed_at:
          type: integer
          format: int64
        alerts:
          type: integer
          format: int64
        investigated:
          type: integer
          format: int64
        linked_case_count:
          type: integer
          format: int64
        escalated_to_customer:
          type: integer
          format: int64
        escalated_to_analyst:
          type: integer
          format: int64
        first_seen_at:
          type: integer
          format: int64
        last_seen_at:
          type: integer
          format: int64
    UserWidgets:
      type: object
      properties:
        repeat_targeted_users:
          type: array
          items:
            $ref: '#/components/schemas/EntityCount'
          description: Users (type=user or service_account) appearing in more than one case.
        users_in_malicious_activity:
          type: array
          items:
            $ref: '#/components/schemas/EntityCount'
          description: Users appearing in malicious cases (disposition=10).
        users_high_false_positives:
          type: array
          items:
            $ref: '#/components/schemas/EntityCount'
          description: Users most frequently appearing in non-malicious cases (disposition in [1,5]).
        multi_vector_targeted_users:
          type: array
          items:
            $ref: '#/components/schemas/MultiVectorUser'
          description: Users involved in more than one distinct attack type.
    ResponseRemediationWidgets:
      type: object
      properties:
        stalled_cases_count:
          type: integer
          description: Number of cases currently in status=10 (CustomerPending).
        stalled_cases_by_category:
          type: array
          items:
            $ref: '#/components/schemas/CategoryCount'
          description: Stalled case count (status=10) grouped by case category.
        customer_response_time:
          $ref: '#/components/schemas/ResponseTimeMetric'
          description: 'Avg time from customer_pending_at to customer_responded_at. Requires two new timestamp fields on CaseTimeline: customer_pending_at (set on status→10) and customer_responded_at (set on first customer activity — comment, field change, or action update).'
    WidgetSourceType:
      type: string
      enum:
      - playbook_execution
      - case_metric
    EntityCount:
      type: object
      required:
      - name
      - case_count
      properties:
        name:
          type: string
          description: Entity value (e.g. IP address, domain, username, hostname).
        entity_type:
          type: string
          description: Entity type (ip, domain, user, service_account, host, file_hash, cloud_resource).
        case_count:
          type: integer
          description: Number of distinct cases this entity appears in.
    CaseActionCount:
      type: object
      required:
      - case_id
      - count
      properties:
        case_id:
          type: string
        count:
          type: integer
          description: Number of actions matching the filter for this case.
    CostTrimOrgTypeRow:
      allOf:
      - $ref: '#/components/schemas/CostTrimRollupBase'
      - type: object
        required:
        - organization_uuid
        - alert_type
        properties:
          organization_uuid:
            type: string
          organization_code:
            type: string
          alert_type:
            type: string
    CreateWidgetsResponse:
      type: object
      required:
      - widgets
      properties:
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/CreateWidgetResponse'
          description: List of created widgets with their IDs and configurations.
    UpdateWidgetRequest:
      type: object
      properties:
        widget_name:
          type: string
        render_type:
          type: string
        nl_description:
          type: string
        layout:
          $ref: '#/components/schemas/WidgetLayout'
        playbook_execution_source:
          $ref: '#/components/schemas/PlaybookExecutionSource'
        system_widget_source:
          $ref: '#/components/schemas/SystemWidgetSelection'
    MultiVectorHost:
      type: object
      required:
      - name
      - attack_types
      properties:
        name:
          type: string
          description: Hostname.
        attack_types:
          type: array
          items:
            $ref: '#/components/schemas/AttackTypeCount'
          description: Distinct alert types this host has been involved in, with case count per type.
        case_count:
          type: integer
    CustomerExperienceWidgets:
      type: object
      properties:
        cases_with_communication_count:
          type: integer
          description: Cases with at least one escalation entry where escalated_to=0 (EscalatedToCustomer). Escalation is the confirmed trigger for customer notification tracking.
        escalation_breakdown:
          $ref: '#/components/schemas/EscalationBreakdown'
          description: Overall breakdown of escalated vs non-escalated cases.
        communication_by_severity:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationBySeverity'
          description: For each severity, count of cases with and without customer communication.
        communication_by_disposition:
          type: array
          items:
            $ref: '#/components/schemas/CommunicationByDisposition'
          description: For each disposition, count of cases with and without customer communication.
    TrendWidgets:
      type: object
      properties:
        cases_over_time:
          type: array
          items:
            $ref: '#/components/schemas/DailyCount'
          description: Daily case volume within the requested date range.
        cases_by_severity:
          type: array
          items:
            $ref: '#/components/schemas/SeverityCount'
          description: Case count broken down by severity level.
        business_hours_breakdown:
          $ref: '#/components/schemas/BusinessHoursBreakdown'
          description: Case volume split by business hours (Mon–Fri 09:00–17:00 UTC) vs after-hours & weekends.
    DashboardScheduleResult:
      type: object
      required:
      - success
      properties:
        schedule_id:
          type: string
          description: Echoes the request item's schedule_id for update/delete results. For create results, present only when success is true (once the new schedule has been assigned an ID).
        success:
          type: boolean
        schedule:
          $ref: '#/components/schemas/DashboardSchedule'
          description: The resulting schedule. Present when success is true, for create and update results (omitted for delete).
        error:
          type: string
          description: Human-readable failure reason. Present when success is false.
    ResponseTimePercentiles:
      type: object
      properties:
        mtta:
          $ref: '#/components/schemas/PercentileMetric'
        mtti:
          $ref: '#/components/schemas/PercentileMetric'
        mttc:
          $ref: '#/components/schemas/PercentileMetric'
        mtt_close:
          $ref: '#/components/schemas/PercentileMetric'
    SocPerformanceDashboardData:
      type: object
      properties:
        kpi:
          $ref: '#/components/schemas/KpiWidgets'
        speed_sla:
          $ref: '#/components/schemas/SpeedSlaWidgets'
        throughput:
          $ref: '#/components/schemas/ThroughputWidgets'
        investigation_quality:
          $ref: '#/components/schemas/InvestigationQualityWidgets'
        response_remediation:
          $ref: '#/components/schemas/ResponseRemediationWidgets'
        consistency:
          $ref: '#/components/schemas/ConsistencyWidgets'
        customer_experience:
          $ref: '#/components/schemas/CustomerExperienceWidgets'
        automation:
          $ref: '#/components/schemas/AutomationWidgets'
        operational_gaps:
          $ref: '#/components/schemas/OperationalGapsWidgets'
    ListDashboardsResponse:
      type: object
      required:
      - dashboards
      properties:
        dashboards:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSummary'
    CreateDashboardRequest:
      type: object
      required:
      - dashboard_name
      properties:
        dashboard_name:
          type: string
        description:
          type: string
          description: Optional free-text description of the dashboard.
        organization_id:
          type: string
          description: Target organisation to create the dashboard in. If not provided, defaults to the user's logged in organization.
        print_config:
          $ref: '#/components/schemas/PrintConfig'
    PlaybookExecutionSource:
      type: object
      required:
      - playbook_uuid
      - node_id
      - step_number
      - schedule_id
      properties:
        playbook_uuid:
          type: string
        playbook_version:
          type: integer
          description: Specific playbook version to use. Defaults to latest if omitted.
        node_id:
          type: string
          description: Unique identifier for the node within the playbook.
        step_number:
          type: integer
          description: 1-indexed step number within the playbook.
        schedule_id:
          type: string
          description: Schedule ID to pull data from. Uses most recent execution if omitted.
    DailyCount:
      type: object
      required:
      - date
      - count
      properties:
        date:
          type: string
          description: Date in YYYY-MM-DD format.
        count:
          type: integer
    SocEmailRequestFilter:
      type: object
      required:
      - created_at_from
      - created_at_to
      properties:
        org_id:
          type: string
          description: Organization identifier (UUID or org code). If not provided, uses the Organization-ID header value
