          description: Drives the chip color. Accepts color-semantic (info/success/warning/danger, emitted by /query_metrics) or severity (Critical/High/Medium/Low/Informational, emitted by the monthly report).
          enum:
          - info
          - success
          - warning
          - danger
          - Critical
          - High
          - Medium
          - Low
          - Informational
          x-enum-varnames:
          - InfoLLMSummaryRisk
          - SuccessLLMSummaryRisk
          - WarningLLMSummaryRisk
          - DangerLLMSummaryRisk
          - CriticalLLMSummaryRisk
          - HighLLMSummaryRisk
          - MediumLLMSummaryRisk
          - LowLLMSummaryRisk
          - InformationalLLMSummaryRisk
        tag:
          type: string
          description: Chip label, e.g. "1 CRITICAL ESCALATION", "TELEMETRY GAP".
        title:
