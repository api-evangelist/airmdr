      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: dashboard_id
        in: path
        required: true
        schema:
          type: string
        description: Dashboard to list schedules for.
      - name: organization_id
        in: query
        required: false
        schema:
          type: string
        description: Filter schedules by organization.
      responses:
        '200':
          description: Schedules retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDashboardSchedulesResponse'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/dashboard/{dashboard_id}/schedule:
    post:
      tags:
      - Dashboard
      operationId: createDashboardScheduleAPI
      summary: Bulk Create Dashboard Schedules
      description: Create one or more recurring email schedules for a custom dashboard. Each item is created independently — one item's failure does not block the others; see the per-item results in the response.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: dashboard_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkCreateDashboardScheduleRequest'
      responses:
        '200':
          description: Request processed. See per-item results for individual outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDashboardScheduleResponse'
        '400':
          description: Invalid request (e.g. no schedules provided, or too many).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Dashboard
      operationId: updateDashboardScheduleAPI
      summary: Bulk Update Dashboard Schedules
      description: Update one or more existing dashboard schedules. Only provided fields are updated on each schedule. Each item is applied independently — one item's failure does not block the others; see the per-item results in the response.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: dashboard_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkUpdateDashboardScheduleRequest'
      responses:
        '200':
          description: Request processed. See per-item results for individual outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDashboardScheduleResponse'
        '400':
          description: Invalid request (e.g. no schedules provided, or too many).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Dashboard
      operationId: deleteDashboardScheduleAPI
      summary: Bulk Delete Dashboard Schedules
      description: Permanently delete one or more dashboard schedules. Each item is deleted independently — one item's failure does not block the others; see the per-item results in the response.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: dashboard_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteDashboardScheduleRequest'
      responses:
        '200':
          description: Request processed. See per-item results for individual outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDashboardScheduleResponse'
        '400':
          description: Invalid request (e.g. no schedule_ids provided, or too many).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/dashboard/{dashboard_id}/schedule/execution/list:
    post:
      tags:
      - Dashboard
      operationId: listDashboardScheduleExecutionsAPI
      summary: List Dashboard Schedule Executions
      description: List the run history across all schedules for a dashboard, most recent first. Supports filtering by organization, schedule, status, date range, and free-text search.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: dashboard_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListDashboardScheduleExecutionsRequest'
      responses:
        '200':
          description: Executions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDashboardScheduleExecutionsResponse'
        '404':
          description: Dashboard not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/dashboard/{dashboard_id}/schedule/execution/{execution_id}/pdf:
    get:
      tags:
      - Dashboard
      operationId: getDashboardScheduleExecutionPdfAPI
      summary: Get Dashboard Schedule Execution PDF
      description: Download the PDF report generated by a schedule execution.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: dashboard_id
        in: path
        required: true
        schema:
          type: string
      - name: execution_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: PDF report binary content.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          description: Execution or PDF not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /case/soc/email:
    post:
      tags:
      - Dashboard
      operationId: emailSocPerformanceReportAPI
      summary: Email SOC Performance Report
      description: Queues SOC Performance Report email for delivery.
      parameters:
      - name: User-ID
        in: header
