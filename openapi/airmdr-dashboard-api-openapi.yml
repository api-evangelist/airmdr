      - Dashboard
      operationId: deleteDashboardAPI
      summary: Delete Dashboard
      description: Permanently delete a dashboard and all its widgets.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: dashboard_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Dashboard deleted successfully.
        '404':
          description: Dashboard not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Dashboard
      operationId: updateDashboardAPI
      summary: Update Dashboard
      description: Rename the dashboard and/or persist widget layout positions. Only widgets listed in widget_layout_updates have their layout updated; others are untouched.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: dashboard_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardRequest'
      responses:
        '200':
          description: Dashboard updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDashboardResponse'
        '404':
          description: Dashboard not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
