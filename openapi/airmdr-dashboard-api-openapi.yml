openapi: 3.2.0
info:
  title: Case Manager Dashboard API
  version: 1.0.0
servers:
- url: /airmdrapi
tags:
- name: Dashboard
paths:
  /case/metrics:
    get:
      tags:
      - Dashboard
      operationId: getCaseMetrics
      summary: Retrieve metrics data
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: days
        in: query
        description: Number of days to include in the metrics calculation (optional)
        schema:
          type: integer
          minimum: 1
          default: 7
        required: false
      - name: organization_id
        in: query
        description: Additional org id filter. Only applicable for Airmdr employees. If empty, metrics for all organizations are shown.
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case metrics fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMetricsResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /case/analytics/metrics:
    get:
      tags:
      - Dashboard
      operationId: getCaseAnalyticsMetrics
      summary: Retrieve case analytics dashboard metrics
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: days
        in: query
        description: Number of days to include in the metrics calculation.
        required: false
        schema:
          type: integer
          minimum: 1
          default: 7
      - name: organization_id
        in: query
        description: Org ID filter. Only applicable for AirMDR employees. If empty, metrics for all accessible organizations are returned.
        required: false
        schema:
          type: string
      - name: created_at_from
        in: query
        description: Start of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: created_at_to
        in: query
        description: End of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: force_refresh
        in: query
        description: When true, bypass any cached result and recompute the metrics.
        required: false
        schema:
          type: boolean
          default: false
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Case analytics metrics fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseAnalyticsDashboardResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /case/soc/metrics:
    get:
      tags:
      - Dashboard
      operationId: getCaseSocPerformanceMetrics
      summary: Retrieve SOC performance dashboard metrics
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: days
        in: query
        description: Number of days to include in the metrics calculation.
        required: false
        schema:
          type: integer
          minimum: 1
          default: 7
      - name: organization_id
        in: query
        description: Org ID filter. Only applicable for AirMDR employees. If empty, metrics for all accessible organizations are returned.
        required: false
        schema:
          type: string
      - name: created_at_from
        in: query
        description: Start of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: created_at_to
        in: query
        description: End of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: force_refresh
        in: query
        description: When true, bypass any cached result and recompute the metrics.
        required: false
        schema:
          type: boolean
          default: false
      security:
      - SessionCookie: []
      responses:
        '200':
          description: SOC performance metrics fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocPerformanceDashboardResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /case/executive/metrics:
    get:
      tags:
      - Dashboard
      operationId: getCaseExecutiveMetrics
      summary: Retrieve executive dashboard metrics
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: days
        in: query
        description: Number of days to include in the metrics calculation.
        required: false
        schema:
          type: integer
          minimum: 1
          default: 7
      - name: organization_id
        in: query
        description: Org ID filter. Only applicable for AirMDR employees. If empty, metrics for all accessible organizations are returned.
        required: false
        schema:
          type: string
      - name: created_at_from
        in: query
        description: Start of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: created_at_to
        in: query
        description: End of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: force_refresh
        in: query
        description: When true, bypass any cached result and recompute the metrics.
        required: false
        schema:
          type: boolean
          default: false
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Executive metrics fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutiveDashboardResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /case/metrics/llm/summary:
    get:
      tags:
      - Dashboard
      operationId: getCaseMetricsLLMSummaryAPI
      summary: Based on the parameters, retrieve LLM generated summary for the metrics data
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: days
        in: query
        description: Number of days to include in the metrics calculation (optional)
        schema:
          type: integer
          minimum: 1
          default: 7
        required: false
      - name: organization_id
        in: query
        description: Additional org id filter. Only applicable for Airmdr employees. If empty, metrics for all organizations are shown.
        schema:
          type: string
      - name: metrics_type
        in: query
        required: true
        description: Type of metrics to generate summary for
        schema:
          type: string
          enum:
          - case_analytics
          - soc_performance
          - system_health
          - security_review
          - case_analytics_v2
          - soc_performance_v2
      - name: created_at_from
        in: query
        description: Start of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: created_at_to
        in: query
        description: End of case creation time range as Unix timestamp (seconds).
        required: false
        schema:
          type: integer
          format: int64
      - name: force_refresh
        in: query
        description: When true, bypass any cached result and recompute the metrics.
        required: false
        schema:
          type: boolean
          default: false
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case metrics summary generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseMetricsSummaryResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /case/metrics/detailed:
    post:
      tags:
      - Dashboard
      operationId: getDetailedCaseMetricsAPI
      summary: Retrieve detailed metrics data
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: start_time
        in: query
        description: Start time for the metrics calculation
        schema:
          type: integer
          format: int64
          description: Start time for the metrics calculation
        required: true
      - name: end_time
        in: query
        description: End time for the metrics calculation
        schema:
          type: integer
          format: int64
          description: End time for the metrics calculation
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetDetailedMetricsRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case metrics fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDetailedMetricsResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /cost_trim_analysis:
    get:
      tags:
      - Dashboard
      operationId: getCostTrimAnalysis
      summary: Retrieve the cost-trim analysis snapshot
      description: 'Returns the latest precomputed alert-type rollup used to surface

        cost-trim opportunities (alert types that produce few or no customer

        escalations). The same base row set is rolled up at request time into

        one of several views (per-org, per-provider, per-type, etc.) so

        dashboards can request exactly the shape they need.


        Efficacy (`escalations / alerts`) is returned per row; bucketing of

        efficacy into named tiers is left to the UI.


        The snapshot is refreshed daily by a background scheduler; the `stale`

        field on the response indicates whether the latest snapshot is older

        than the configured freshness window.'
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: view
        in: query
        description: 'Roll-up shape. Defaults to `org_provider_type` (raw rows). Other

          values produce server-side aggregations of the same base rows.

          '
        required: false
        schema:
          type: string
          enum:
          - org_provider_type
          - org_type
          - provider_type
          - org
          - provider
          - type
          - escalations_by_type
          default: org_provider_type
      - name: organization_id
        in: query
        description: 'Restrict the response to the given organization UUIDs. If omitted,

          all organizations the caller has access to via RBAC are included.

          Values are intersected with the accessible set server-side.

          '
        required: false
        schema:
          type: array
          items:
            type: string
        explode: true
      - name: provider
        in: query
        description: Case-insensitive exact-match filter on `alert_provider`.
        required: false
        schema:
          type: string
      - name: alert_type
        in: query
        description: Case-insensitive substring filter on `alert_type`.
        required: false
        schema:
          type: string
      - name: min_alerts
        in: query
        description: Drop rows whose total alert count is below this threshold.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: escalation_thresholds
        in: query
        description: 'Comma-separated list of escalation-rate thresholds (0.0–1.0) used to

          compute the `trim_headroom` columns on the `org` view. Defaults to

          `0,0.05,0.10,0.25`.

          '
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of rows to return.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 500
      - name: offset
        in: query
        description: Row offset for pagination.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Cost-trim analysis snapshot fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostTrimAnalysisResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/dashboard/system-widgets:
    get:
      tags:
      - Dashboard
      operationId: listSystemWidgetsAPI
      summary: List System Widgets
      description: Returns the catalogue of all available system widgets from the Case Analytics, SOC Performance, and Security Review dashboards.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      responses:
        '200':
          description: System widgets retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSystemWidgetsResponse'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/dashboard:
    get:
      tags:
      - Dashboard
      operationId: listDashboardsAPI
      summary: List Dashboards
      description: List all dashboards for the organization.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: organization_id
        in: query
        required: false
        schema:
          type: string
        description: Filter dashboards by organization.
      responses:
        '200':
          description: Dashboards retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDashboardsResponse'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - Dashboard
      operationId: createDashboardAPI
      summary: Create Dashboard
      description: Create a new empty dashboard.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDashboardRequest'
      responses:
        '201':
          description: Dashboard created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/dashboard/{dashboard_id}:
    get:
      tags:
      - Dashboard
      operationId: getDashboardSnapshotAPI
      summary: Get Dashboard with latest snapshot of widgets
      description: Get a dashboard with all its active widgets and their latest outputs.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: dashboard_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Dashboard retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDashboardResponse'
        '404':
          description: Dashboard not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
