          type: string
      - name: widget_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWidgetRequest'
      responses:
        '200':
          description: Widget updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateWidgetResponse'
        '400':
