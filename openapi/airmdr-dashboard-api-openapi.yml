          additionalProperties:
            type: number
            format: float
        daily_mean_metrics:
          type: object
          additionalProperties:
            type: number
            format: float
    BlockedByCategoryCount:
      type: object
      required:
      - category
      - total
      properties:
        category:
          type: string
        critical_high_count:
          type: integer
          description: Blocked cases with severity in [10, 15] (High, Critical).
        medium_count:
          type: integer
          description: Blocked cases with severity=5 (Medium).
        low_info_count:
          type: integer
          description: Blocked cases with severity in [0, 1, 2] (Unassigned, Low, Informational).
        total:
          type: integer
          description: Total blocked cases in this category.
    UpdateDashboardRequest:
      type: object
      properties:
        dashboard_name:
          type: string
          description: New display name for the dashboard.
        description:
          type: string
          description: New description for the dashboard.
        widget_layout_updates:
          type: array
          description: Partial layout update. Only listed widgets are updated.
          items:
            $ref: '#/components/schemas/WidgetLayoutUpdate'
        print_config:
          $ref: '#/components/schemas/PrintConfig'
    AutomationWidgets:
      type: object
      properties:
        time_saved_chart:
          type: array
          items:
            $ref: '#/components/schemas/MttiComparisonPoint'
          description: Line chart data showing time difference (avg_mtti - x) for investigation durations from min to max in 1-minute increments.
        adr_triage_trend:
          type: array
          items:
            $ref: '#/components/schemas/AdrTriageDailyBreakdown'
          description: Daily automation tier breakdown for trend chart.
    SystemWidgetSelection:
      type: object
      required:
      - widget_id
      - dashboard_source
      - category
      - days
      - data_source_ids
      properties:
        widget_id:
          type: string
          description: ID of the system widget (e.g., mtta, top_attacking_ips).
        dashboard_source:
          type: string
          description: Source dashboard (case_analytics, soc_performance, security_review).
        category:
          type: string
          description: Category of the widget for organization.
        days:
          type: integer
          description: Time window in days for the widget data (e.g. 7, 30, 90).
        data_source_ids:
          type: array
          items:
            type: string
          description: List of data sources (filtered from metrics apis) to include in the widget.
          minItems: 1
    ProviderList:
      type: object
      required:
      - provider
      - alert_count
      properties:
        provider:
          $ref: '#/components/schemas/ProviderSummary'
        alert_count:
          type: integer
          description: Number of alerts
    PercentileMetric:
      type: object
      properties:
        p50_seconds:
          type: integer
          description: 50th percentile (median) value in seconds.
        p95_seconds:
          type: integer
          description: 95th percentile value in seconds.
        p99_seconds:
          type: integer
          description: 99th percentile value in seconds.
    AdrTriageCount:
      type: object
      required:
      - adr_triage
      - count
      properties:
        adr_triage:
          type: integer
          description: 'Automation level: 0=NA, 1=None (manual), 5=Partial, 10=Full (automated).'
        count:
          type: integer
        percentage:
          type: number
          format: float
          description: Percentage of total cases in this tier.
