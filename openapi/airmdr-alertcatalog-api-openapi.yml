openapi: 3.2.0
info:
  title: Airmdr Alert Catalog API
  version: 1.0.0
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  description: 'Operations tagged AlertCatalog across 2 of this provider''s published API definitions: airmdr-case-manager-openapi.json, airmdr-case-manager-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /airmdrapi
- url: https://app.airmdr.com/airmdrapi
  description: AirMDR API (relative /airmdrapi in the published spec, resolved against app.airmdr.com per docs.airmdr.com/api-reference/apitoken)
tags:
- name: AlertCatalog
paths:
  /alert_catalog:
    post:
      tags:
      - AlertCatalog
      operationId: listAlertCatalogTypeAPI
      summary: List alert providers and type
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: search
        in: query
        description: search text to filter alert providers and types
        schema:
          type: string
      - name: page
        in: query
        description: Page number for paginated results.
        schema:
          type: integer
      - name: size
        in: query
        description: Number of results per page.
        schema:
          type: integer
      security:
      - SessionCookie: []
      requestBody:
        description: Request body for list alert providers and types.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListAlertCatalogTypesRequest'
      responses:
        '200':
          description: Alert Providers and Types fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAlertCatalogTypesResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_catalog/providers:
    get:
      tags:
      - AlertCatalog
      operationId: listAlertCatalogProvidersAPI
      summary: List alert providers
      parameters:
      - name: User-ID
        in: header
        required: true
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        required: true
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: page
        in: query
        description: Page number for paginated results.
        schema:
          type: integer
      - name: size
        in: query
        description: Number of results per page.
        schema:
          type: integer
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert Providers fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAlertCatalogProvidersResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_catalog/details:
    get:
      tags:
      - AlertCatalog
      operationId: getAlertCatalogDetailsAPI
      summary: Get Alert Catalog details
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: alert_provider
        in: query
        required: false
        description: alert provider
        schema:
          type: string
      - name: alert_type
        in: query
        required: false
        description: alert_type
        schema:
          type: string
      - name: case_id
        in: query
        required: false
        description: case id
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert Catalog fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertCatalogResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_catalog/details/case/{case_id}:
    get:
      tags:
      - AlertCatalog
      operationId: getCaseInAlertCatalogAPI
      summary: Get Case details in alert catalog
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: case_id
        in: path
        description: case id
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Case Details fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCaseInAlertCatalogResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
      - AlertCatalog
      operationId: upsertCaseInAlertCatalogAPI
      summary: Upsert Case details in alert catalog
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: case_id
        in: path
        description: case id
        schema:
          type: string
      security:
      - SessionCookie: []
      requestBody:
        description: Request body for upsert case for alert provider and alert type.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertCaseInAlertCatalogRequest'
      responses:
        '200':
          description: Case Details fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertCatalogResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_catalog/alert:
    post:
      tags:
      - AlertCatalog
      operationId: GenerateAlertUsingLLMAPI
      summary: Generate Alert Using LLM
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      security:
      - SessionCookie: []
      requestBody:
        description: Request body alert generated for alert provider and alert type.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateAlertUsingLLMRequest'
      responses:
        '200':
          description: Generated Alert Using LLM successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertCatalogData'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_catalog/executions:
    get:
      tags:
      - AlertCatalog
      operationId: getAlertCatalogExecutionHistoryAPI
      summary: Get execution history for alert catalog
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: search
        in: query
        description: search text to filter execution history
        schema:
          type: string
      - name: page
        in: query
        description: Page number for paginated results.
        schema:
          type: integer
      - name: size
        in: query
        description: Number of results per page.
        schema:
          type: integer
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Execution history fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertCatalogExecutionHistoryResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_catalog/{execution_id}:
    get:
      tags:
      - AlertCatalog
      operationId: getAlertCatalogByExecutionIdAPI
      summary: Get alert catalog by execution id
      parameters:
      - name: execution_id
        in: path
        description: execution id
        schema:
          type: string
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert catalog fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertCatalogByExecutionIdResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
  /alert_catalog/demo_requested:
    get:
      tags:
      - AlertCatalog
      operationId: getDemoRequestedStatusAPI
      summary: Get demo requested status
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Demo requested status fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDemoResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
      - AlertCatalog
      operationId: requestDemoAPI
      summary: Request demo
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Demo requested successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestDemoResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
components:
  schemas:
    ListAlertCatalogTypesFilter:
      type: object
      properties:
        search_query:
          type: string
        provider_id:
          type: array
          items:
            type: string
    AlertsIOC:
      type: object
      properties:
        ip_address:
          type: array
          items:
            type: string
        domain:
          type: array
          items:
            type: string
        username:
          type: array
          items:
            type: string
        location:
          type: array
          items:
            type: string
        hostname:
          type: array
          items:
            type: string
        url:
          type: array
          items:
            type: string
        ioc_fields:
          type: object
    ExploreDeeperQuestion:
      type: object
      required:
      - title
      - description
      - status
      - exploration_type
      - key_identifiers
      - question_id
      - created_at
      properties:
        question_id:
          type: string
          description: Question ID of the explore deeper question
        title:
          type: string
          description: Title of the explore deeper question
        description:
          type: string
          description: Description of the explore deeper question
        status:
          $ref: '#/components/schemas/ExploreDeeperQuestionStatus'
          description: Status of the explore deeper question
        exploration_type:
          $ref: '#/components/schemas/ExplorationType'
          description: Type of exploration for the explore deeper question
        required_data:
          type: string
          description: Required data for the explore deeper question
        answer:
          type: string
          description: Answer to the explore deeper question
        key_identifiers:
          type: array
          items:
            type: string
          description: Key identifiers used to identify the data for the explore deeper question
        created_at:
          type: integer
          format: int64
          description: Timestamp of creation of the explore deeper question
    EventOutcome:
      type: string
      enum:
      - success
      - failure
      - partial
      - unknown
      x-enum-varnames:
      - EventOutcomeSuccess
      - EventOutcomeFailure
      - EventOutcomePartial
      - EventOutcomeUnknown
    CaseConfidence:
      type: object
      required:
      - score
      - summary
      - assumptions
      - missing_information
      properties:
        score:
          type: integer
          description: Number indicating the confidence of the investigation and conclusion
        summary:
          type: string
          description: Describe how the confidence number was established
        assumptions:
          type: string
          description: Assumptions made while investigating the case
        missing_information:
          type: string
          description: Information that was missing while investigating the case
    EvidenceAttachmentType:
      type: integer
      enum:
      - 0
      - 1
      - 5
      x-enum-varnames:
      - UndefinedAttachmentType
      - JsonAttachmentType
      - PdfAttachmentType
    GetAlertResponse:
      type: object
      required:
      - alert_id
      - alert_uuid
      - alert_content
      - alert_provider
      - alert_ioc
      - organization_uuid
      - organization_code
      - created_at
      - created_by
      - created_at_source
      - fetched_playbook_id
      - fetched_playbook_name
      - investigation_status
      - alert_provider_details
      - alert_link
      properties:
        alert_id:
          type: string
        alert_uuid:
          type: string
        alert_content:
          type: string
        alert_provider:
          type: string
        alert_type:
          type: string
        alert_ioc:
          $ref: '#/components/schemas/AlertsIOC'
        organization_uuid:
          type: string
        organization_code:
          type: string
        created_by:
          type: string
        created_at:
          type: integer
          format: int64
        modified_at:
          type: integer
          format: int64
        created_at_source:
          type: integer
          format: int64
        fetched_playbook_id:
          type: string
        fetched_playbook_name:
          type: string
        fetched_execution_id:
          type: string
        investigation_playbook_id:
          type: string
        investigation_playbook_name:
          type: string
        investigation_status:
          $ref: '#/components/schemas/AlertInvestigationStatus'
        investigation_retry_count:
          type: integer
        investigation_completed_time:
          type: integer
          format: int64
        execution_id:
          type: string
        linked_case_id:
          type: string
          description: ID of the latest case linked to the alert
        original_alert_id:
          type: string
          description: When investigation_status is Duplicate, the alert_id this alert was found to be a duplicate of
        alert_provider_details:
          $ref: '#/components/schemas/ProviderDetails'
        resolved:
          type: boolean
        is_investigated_with_agent:
          type: boolean
          description: Flag indicating whether the alert was investigated by the agentic investigation service
        is_alert_reinvestigated:
          type: boolean
          description: Flag indicating whether the alert has been manually reinvestigated via the InvestigateAlert API
        alert_summary:
          type: string
          description: Human-readable summary of the alert
        linked_case_details:
          type: array
          items:
            $ref: '#/components/schemas/CaseExecutionDetails'
          description: Details of the all the cases that are linked to the alert
        linked_case_summary:
          $ref: '#/components/schemas/LinkedCaseSummary'
          description: Summary of the latest case linked to the alert
        connection_details:
          $ref: '#/components/schemas/ConnectionDetails'
          description: Details of the connection fetched the alert
        alert_type_details:
          $ref: '#/components/schemas/AlertTypeWithProperties'
          description: Details of the alert type
        alert_link:
          type: string
          description: URL for the alert
    Event:
      type: object
      required:
      - event_id
      - actor
      - action
      - target
      - outcome
      - finding_refs
      properties:
        event_id:
          type: string
          description: ID of the event
        timestamp:
          type: integer
          description: Timestamp of the event
        actor:
          type: array
          items:
            type: string
          description: Actors of the event
        action:
          type: string
          description: Action of the event
        target:
          type: array
          items:
            type: string
          description: Targets of the event
        outcome:
          $ref: '#/components/schemas/EventOutcome'
          description: Outcome of the event
        summary:
          type: string
          description: Summary of the event
        severity:
          $ref: '#/components/schemas/EventSeverity'
          description: Severity of the event
        mitre_technique_id:
          type: string
          description: MITRE technique ID of the event
        mitre_technique_name:
          type: string
          description: MITRE technique name of the event
        finding_refs:
          type: array
          items:
            type: string
          description: Finding references of the event
    AdrTriage:
      type: integer
      enum:
      - 0
      - 1
      - 5
      - 10
      x-enum-varnames:
      - NotAvaialbleAdrTriage
      - NoneAdrTriage
      - PartialAdrTriage
      - FullAdrTriage
    LinkedAlertSource:
      type: object
      required:
      - uuid
      - type
      - name
      - path
      properties:
        type:
          $ref: '#/components/schemas/LinkedAlertSourceType'
          description: Possible Values are 0(Internal alert), 1 (external link)
        name:
          type: string
        path:
          type: string
        uuid:
          type: string
        alert_link:
          type: string
    CaseScoreMinimal:
      type: object
      required:
      - score
      - score_status
      properties:
        score:
          type: number
          description: Score of the case
        score_status:
          $ref: '#/components/schemas/ScoreStatus'
          description: Status of the score
    SortFields:
      type: object
      required:
      - field
      - sort_order
      properties:
        field:
          type: string
          description: indicates which field will be used for sorting
        sort_order:
          $ref: '#/components/schemas/SortOrder'
          description: indicates sort order - asc or desc
    CasePriorityV2:
      type: integer
      enum:
      - 0
      - 5
      - 10
      x-enum-varnames:
      - NeedAttentionCasePriorityV2
      - ActiveCasePriorityV2
      - ClosedCasePriorityV2
    UserDetail:
      type: object
      required:
      - firstname
      - user_uuid
      - email
      properties:
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
        user_uuid:
          type: string
    GetExecutionLogResponse:
      type: object
      required:
      - execution_id
      - execution_status
      - skill_id
      - skill_type
      - skill_name
      - execution_trigger_source
      - submitted_at
      properties:
        execution_id:
          type: string
        execution_result:
          type: string
        ai_summary:
          type: string
        execution_status:
          type: integer
        skill_id:
          type: string
        skill_version:
          type: integer
        skill_name:
          type: string
        alert_id:
          type: string
        skill_type:
          type: integer
        nl_playbook:
          type: string
        validate_version:
          type: string
        steps_executed:
          type: integer
        total_steps:
          type: integer
        step_outputs:
          type: array
          items:
            $ref: '#/components/schemas/SkillExecutionOutput'
        chat_session_id:
          type: string
        submitted_at:
          type: integer
          format: int64
        started_at:
          type: integer
          format: int64
        completed_at:
          type: integer
          format: int64
    AlertInvestigationStatus:
      type: integer
      enum:
      - 0
      - 5
      - 10
      - 12
      - 15
      - 20
      - 25
      - 30
      - 35
      - 40
      x-enum-varnames:
      - AlertInvestigationStatusCreated
      - AlertInvestigationStatusSubmitted
      - AlertInvestigationStatusInProgress
      - AlertInvestigationStatusSuspended
      - AlertInvestigationStatusCompleted
      - AlertInvestigationStatusFailed
      - AlertInvestigationStatusInvestigationLimitReached
      - AlertInvestigationStatusStopped
      - AlertInvestigationStatusSkipped
      - AlertInvestigationStatusDuplicate
    EntityType:
      type: string
      enum:
      - user
      - service_account
      - host
      - ip
      - domain
      - file_hash
      - cloud_resource
      - process
      - threat_actor
      x-enum-varnames:
      - EntityTypeUser
      - EntityTypeServiceAccount
      - EntityTypeHost
      - EntityTypeIP
      - EntityTypeDomain
      - EntityTypeFileHash
      - EntityTypeCloudResource
      - EntityTypeProcess
      - EntityTypeThreatActor
    Relationship:
      type: object
      required:
      - relationship_id
      - source
      - target
      - type
      - finding_refs
      - event_refs
      properties:
        relationship_id:
          type: string
          description: ID of the relationship
        source:
          type: string
          description: Source of the relationship
        target:
          type: string
          description: Target of the relationship
        type:
          $ref: '#/components/schemas/RelationshipType'
          description: Type of the relationship
        timestamp:
          type: integer
          description: Timestamp of the relationship
        confidence:
          type: integer
          description: Confidence of the relationship
        label:
          type: string
          description: Label of the relationship
        finding_refs:
          type: array
          items:
            type: string
          description: Finding references of the relationship
        event_refs:
          type: array
          items:
