  /v2/case/{case_uuid}/attachment:
    post:
      tags:
      - Case Manager V2
      operationId: uploadCaseAttachmentAPI
      summary: upload an image attachment for a case
      description: 'Uploads a single image, stored in the case attachments S3 bucket and rendered in the images strip under the alert details section of the case. The bytes are validated server side: the declared content type is ignored in favour of magic byte sniffing, the file must decode as a real image, and SVG is never accepted because serving it same origin would be stored XSS in an analyst session.'
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: Execution-ID
        in: header
        description: ID of the execution if action is performed through a darryl action
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The id or uuid of the case
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The image to upload. Maximum 5 MiB. Allowed types are PNG, JPEG and GIF.
                section:
                  type: string
                  description: Which section of the case the image belongs to. Defaults to alert_details.
                  enum:
                  - alert_details
                  - comment
                caption:
                  type: string
                  description: Optional analyst supplied caption.
      responses:
        '201':
          description: attachment uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCaseAttachmentResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/case/{case_uuid}/attachments:
    get:
      tags:
      - Case Manager V2
      operationId: listCaseAttachmentsAPI
      summary: list the image attachments for a case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The id or uuid of the case
        required: true
        schema:
          type: string
      - name: section
        in: query
        description: Restrict the result to a single section. All sections are returned when omitted.
        schema:
          type: string
          enum:
          - alert_details
          - comment
      - name: comment_id
        in: query
        description: 'Restrict the result to images attached to a single comment. Implies section=comment.

          '
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: attachments fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCaseAttachmentsResponse'
        default:
