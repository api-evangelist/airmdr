          description: Temporary filter configuration to apply. Only provided fields will be updated.
        temp_sort:
          type: array
          items:
            $ref: '#/components/schemas/CaseSort'
          description: Temporary sort configuration for current session. Will replace existing sort configuration if provided.
        selected_case_id:
          type: string
          description: ID of the currently selected case
