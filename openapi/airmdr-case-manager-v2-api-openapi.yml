        description: The id or uuid of the case
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: operation performed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCaseResponseV2'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/case/{case_uuid}/finding:
