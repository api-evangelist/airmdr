  /v2/case/{case_uuid}/attachment/{attachment_uuid}/content:
    get:
      tags:
      - Case Manager V2
      operationId: getCaseAttachmentContentAPI
      summary: stream the bytes of a case image attachment
      description: Streams the image from S3 through the service so that organization access is re-checked on every request. This is the URL used as the src of the rendered img element; it is permanent and revocable, unlike a presigned S3 URL. The response Content-Type is the type sniffed at upload time and is served with X-Content-Type-Options nosniff and a restrictive Content-Security-Policy.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The id or uuid of the case
        required: true
        schema:
          type: string
      - name: attachment_uuid
        in: path
        description: The uuid of the attachment
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: attachment content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
