openapi: 3.2.0
info:
  title: Case Manager V2 API
  version: 1.0.0
servers:
- url: /airmdrapi
tags:
- name: Case Manager V2
paths:
  /v2/case:
    post:
      tags:
      - Case Manager V2
      operationId: createCaseAPIV2
      summary: create a new v2 case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: Execution-ID
        in: header
        description: ID of the execution if action is perfomed through a darryl action
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequestV2'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseResponseV2'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/case/{case_uuid}:
    get:
      tags:
      - Case Manager V2
      operationId: getCaseAPIV2
      summary: get details of a v2 case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: Execution-ID
        in: header
        description: ID of the execution if action is perfomed through a darryl action
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The id of the case to be fetched
        required: true
        schema:
          type: string
      - name: requested_view
        in: query
        description: Requested view of the case
        required: true
        schema:
          $ref: '#/components/schemas/CaseView'
      - name: include_hidden_findings
        in: query
        description: Whether to include hidden findings in the response
        required: false
        schema:
          type: boolean
      - name: subscribe_to_updates
        in: query
        description: If true, the user will receive WebSocket events when this case is updated
        required: false
        schema:
          type: boolean
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCaseResponseV2'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Case Manager V2
      operationId: updateCaseAPIV2
      summary: update details of a v2 case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: Execution-ID
        in: header
        description: ID of the execution if action is perfomed through a darryl action
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The uuid of the case to be updated
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCaseRequestV2'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCaseResponseV2'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Case Manager V2
      operationId: archiveCaseAPI
      summary: archive a case
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: Execution-ID
        in: header
        description: ID of the execution if action is perfomed through a darryl action
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The id or uuid of the case
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: case archived successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
