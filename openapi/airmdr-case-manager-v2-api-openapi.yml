  /v2/case/{case_uuid}/finding/{finding_uuid}/evidence/{evidence_uuid}:
    get:
      tags:
      - Case Manager V2
      operationId: getEvidenceAPI
      summary: get evidence data for a finding based on uuid
      parameters:
