        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: Execution-ID
        in: header
        description: ID of the execution if action is perfomed through a darryl action
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization
        schema:
          type: string
      - name: case_uuid
        in: path
        description: The id or uuid of the case to delete finding from
        required: true
        schema:
          type: string
      - name: finding_uuid
        in: path
        description: The id or uuid of the finding to be deleted
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: finding deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteCaseFindingResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
