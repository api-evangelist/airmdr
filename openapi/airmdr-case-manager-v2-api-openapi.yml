          $ref: '#/components/schemas/CaseViewMode'
          description: Specify the user selectedview mode - anaylst view or reader view
    ListSavedViewsResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/SavedView'
          description: List of saved views for the organization
    CaseAttachment:
      type: object
      required:
      - attachment_uuid
      - case_uuid
      - section
      - content_path
      - content_type
      - size_bytes
      - original_filename
      - created_at
      properties:
        attachment_uuid:
          type: string
          description: Unique identifier of the attachment
        case_uuid:
          type: string
          description: Uuid of the case the attachment belongs to
        comment_id:
          type: string
          description: 'Set when section is comment, identifying which comment the image belongs to. Absent while an upload is still unclaimed, and absent entirely for other sections.

            '
        section:
          type: string
          description: Which section of the case the image is rendered under
          enum:
          - alert_details
          - comment
        content_path:
          type: string
          description: 'Service relative path to stream the image bytes from. Use this directly as the src of an img element. It is relative rather than absolute because organizations can be served from different hosts, and it never expires.

            '
        content_type:
          type: string
          description: The image type detected from the file contents at upload time
        size_bytes:
          type: integer
          format: int64
          description: Size of the stored image in bytes
        width:
          type: integer
          description: Pixel width, so the UI can reserve layout space before the image loads
        height:
          type: integer
          description: Pixel height, so the UI can reserve layout space before the image loads
        sha256:
          type: string
          description: SHA-256 of the stored bytes
        original_filename:
          type: string
          description: Sanitized filename supplied by the uploader, for display only
        caption:
          type: string
          description: Optional analyst supplied caption
        uploaded_by:
          $ref: '#/components/schemas/UserInformation'
        created_at:
          type: integer
          format: int64
          description: Upload time as a unix timestamp
    UserViewPreferenceResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserViewPreference'
    UpdateCustomCaseFieldRequest:
      type: object
      properties:
        title:
          type: string
          description: Updated title of the custom field
    CreateCaseResponseV2:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          $ref: '#/components/schemas/CaseDetailsV2'
          description: created case object
    EntityFilter:
      type: object
      required:
      - items
      properties:
        operator:
          type: string
          description: Operator to combine the entity filter items. Can be "and" or "or". Default is "and".
          enum:
          - and
          - or
          x-enum-varnames:
          - EntityFilterOperatorAnd
          - EntityFilterOperatorOr
        items:
          type: array
          items:
            $ref: '#/components/schemas/EntityFilterItem'
