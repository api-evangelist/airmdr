        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: chart config retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardChartConfigResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Case Manager V2
      operationId: updateDashboardChartConfigAPI
      summary: Add or update chart types for widgets on an OOB dashboard
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: dashboard_source
        in: query
        required: true
        description: OOB dashboard identifier (case_analytics, soc_performance or executive).
        schema:
          type: string
      - name: organization_id
        in: query
        required: true
        description: Target organization to update chart config for.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDashboardChartConfigRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: chart config updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardChartConfigResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    ChangelogActionType:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 5
      - 10
      - 11
      - 12
      x-enum-varnames:
      - NoChange
      - Add
      - Create
      - Update
      - Delete
      - Remove
      - Archive
    CaseFilterV2:
      type: object
      properties:
        severity:
          type: array
          items:
            type: integer
        severity_label:
          type: array
          items:
            type: string
        status:
          type: array
          items:
            type: integer
        status_label:
          type: array
          items:
            type: string
        disposition:
          type: array
          items:
            type: integer
        disposition_label:
          type: array
          items:
            type: string
        provider:
          type: array
          items:
            type: string
          description: Provider names
        custom_field_values:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldValue'
          description: Custom field values
        assignee:
          type: string
        assignee_id:
          type: array
          items:
            type: string
        watcher:
          type: string
          description: Can either be watcher uuid, name or email
        organization_id:
          type: array
          items:
            type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryFilter'
        modified_at_time_range:
          $ref: '#/components/schemas/TimeRange'
        created_at_time_range:
          $ref: '#/components/schemas/TimeRange'
        queries:
          type: array
          description: list of queries to search for in all fields. A case will be listed if it matches any of the queries
          items:
            type: string
        search_fields:
          type: array
          description: list of fields to search the queries in. If not provided, it will search in all fields.
          items:
            type: string
        archived:
          type: boolean
          description: Flag indicating if archived cases has to be searched or not
        only_archived:
          type: boolean
          description: if true, only archived cases are shown. Takes precedence over the archived flag.
        only_escalated:
          type: boolean
          description: if false, all cases are shown. If true, only escalated cases are shown.
        only_descalated:
          type: boolean
          description: if false, all cases are shown. If true, only de-escalated cases are shown.
        only_marked_for_review:
          type: boolean
          description: if false, all cases are shown. If true, only cases marked for review are shown.
        priority:
          type: array
          description: Priority of the case. Possible values are 0 (Need Attention), 1 (Active), 5(Closed)
          items:
            type: integer
        has_case_score:
          type: boolean
          description: if true, case has a score
        case_score:
          $ref: '#/components/schemas/NumberRange'
          description: range of the case score
        entities:
          $ref: '#/components/schemas/EntityFilter'
          description: filter for entities (iocs) in the case
        case_sensitive:
          type: boolean
          description: if true, search is case-sensitive. If false or omitted, search is case-insensitive (default)
    CaseFeature:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    AddCommentSource:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 5
      - 6
      x-enum-varnames:
      - User
      - EscalationToCustomer
      - EscalationToAnalyst
      - DescalationToCustomer
      - DescalationToAnalyst
    ProviderSummary:
      type: object
      required:
