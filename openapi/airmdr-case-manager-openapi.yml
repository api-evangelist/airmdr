components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: Session
  schemas:
    CaseType:
      type: integer
      enum:
      - 0
      - 5
      x-enum-varnames:
      - BasicCaseType
      - V2CaseType
    CaseStatus:
      type: integer
      enum:
      - 0
      - 1
      - 5
      - 10
      - 20
      - 30
      x-enum-varnames:
      - NewCaseStatus
      - ProgressCaseStaus
      - PendingCaseStaus
      - WaitingForCustomerStatus
      - ContainedCaseStaus
      - ClosedCaseStaus
    CaseSeverity:
      type: integer
      enum:
      - 0
      - 1
      - 5
      - 10
      - 20
      x-enum-varnames:
      - InformationalCaseSeverity
      - LowCaseSeverity
      - MediumCaseSeverity
      - HighCaseSeverity
      - CriticalCaseSeverity
    CasePriority:
      type: integer
      enum:
      - 0
      - 10
      - 20
      - 30
      x-enum-varnames:
      - LowCasePriority
      - MediumCasePriority
      - HighCasePriority
      - CriticalCasePriority
    AlertSource:
      type: integer
      enum:
      - 0
      x-enum-varnames:
      - ManualAlertSource
    AlertCategory:
      type: integer
      enum:
      - 0
      x-enum-varnames:
      - ManualAlertCategory
    CaseDisposition:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      x-enum-varnames:
      - Pending
      - TruePositive
      - BenignTruePositive
      - FalsePositive
    CaseSummaryField:
      type: object
      properties:
        executive_summary:
          type: string
        what_happened:
          type: string
        why_it_matters:
          type: string
        justification_for_decision:
          type: string
        who:
          type: string
        when:
          type: string
        reasons_for_concern:
          type: string
        reasons_for_close:
          type: string
        additional_context:
          type: string
        next_steps:
          type: string
        improvement_opportunities:
          type: string
        feedback:
          type: string
    CreateCaseRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Title to be set for the case
        organization_id:
          type: string
          description: Identifier (uuid or org code) of the organization associated with the case
        type:
          $ref: '#/components/schemas/CaseType'
        status:
          $ref: '#/components/schemas/CaseStatus'
        severity:
          $ref: '#/components/schemas/CaseSeverity'
        priority:
          $ref: '#/components/schemas/CasePriority'
        assignee:
          type: string
          description: Uuid of the assigned user
        assignee_email:
          type: string
          description: Email of the assigned user
        performed_by_darryl:
          type: boolean
        alert_source:
          $ref: '#/components/schemas/AlertSource'
        alert_category:
          $ref: '#/components/schemas/AlertCategory'
        alert_created_at:
          type: integer
          description: Creation time of alert in seconds/epoch time.
        disposition:
          $ref: '#/components/schemas/CaseDisposition'
        escalated_to_customer:
          type: boolean
        case_summary_fields:
          $ref: '#/components/schemas/CaseSummaryField'
          description: Case summary object
        linked_sessions:
          type: array
          items:
            type: string
          description: Linked sessions with the case
        linked_alerts:
          type: array
          items:
            type: string
          description: Linked alerts with the case
        categories:
          type: array
          items:
            type: string
          description: Values indicating the categories assigned to case.
        sub_categories:
          type: array
          items:
            type: string
          description: Values indicating the sub categories assigned to case.
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: user friendly error message
    UserDetails:
      type: object
      properties:
        firstname:
          type: string
        lastname:
          type: string
        user_uuid:
          type: string
        performed_by_darryl:
          type: boolean
    UserDetail:
      type: object
      required:
      - firstname
      - user_uuid
      - email
      properties:
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
        user_uuid:
          type: string
