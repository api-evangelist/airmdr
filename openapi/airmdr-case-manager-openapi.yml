    ScheduleFrequency:
      type: string
      enum:
      - send_now
      - daily
      - weekly
      - monthly
      description: Delivery mode. send_now triggers an immediate one-off send; others set up a recurring schedule.
    ScheduleRecurrence:
      type: object
      description: Recurrence config. Required for daily/weekly/monthly; omit for send_now.
      required:
      - hour
      - minute
      - user_timezone_offset
      properties:
        hour:
          type: integer
          minimum: 0
          maximum: 23
          description: Hour of day to send (0–23, in the specified timezone).
        minute:
          type: integer
          minimum: 0
          maximum: 59
          description: Minute of hour to send (0–59).
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
          description: Day of week (0=Sunday, 6=Saturday). Required when frequency is weekly.
        day_of_month:
          type: integer
          minimum: 1
          maximum: 31
          description: Day of month (1–31). Required when frequency is monthly.
        user_timezone_offset:
          type: integer
          minimum: -720
          maximum: 720
          description: User's timezone offset in minutes from UTC. Required for all frequencies.
    DashboardSchedule:
      type: object
      required:
      - schedule_id
      - organization_id
      - organization_code
      - name
      - frequency
      - recipients
      - is_enabled
      - frequency_display
      - created_at
      - updated_at
      - created_by
      properties:
        schedule_id:
          type: string
        organization_id:
          type: string
        organization_code:
          type: string
          description: Human-readable org code shown in the schedule list (e.g. ASO).
        name:
          type: string
        frequency:
          $ref: '#/components/schemas/ScheduleFrequency'
        recurrence:
          $ref: '#/components/schemas/ScheduleRecurrence'
          description: Null for send_now schedules.
        recipients:
          type: array
          items:
            type: string
            format: email
          minItems: 1
        is_enabled:
          type: boolean
          description: Whether the schedule is active. False pauses delivery without deleting the schedule.
        frequency_display:
          type: string
          description: Human-readable recurrence summary shown in the list (e.g. "Every Monday at 9:00 AM", "Monthly on the
            1st at 8:00 AM").
        created_at:
          type: integer
          format: int64
          description: Unix epoch seconds (UTC).
        updated_at:
          type: integer
          format: int64
          description: Unix epoch seconds (UTC).
        created_by:
          type: string
          description: User ID of the creator.
    ListDashboardSchedulesResponse:
      type: object
      required:
      - schedules
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/DashboardSchedule'
        total:
          type: integer
          description: Total count of schedules available for user.
    CreateDashboardScheduleRequest:
      type: object
      required:
      - name
      - frequency
      - recipients
      properties:
        name:
          type: string
