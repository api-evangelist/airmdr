          description: 'Mean Time to Acknowledge: avg(alert_acknowledged_at - alert_raised_at).'
        mtti:
          $ref: '#/components/schemas/ResponseTimeMetric'
          description: 'Mean Time to Investigate: avg(investigation_completed_at - alert_acknowledged_at).'
        mttc:
          $ref: '#/components/schemas/ResponseTimeMetric'
          description: 'Mean Time to Contain: avg(case_contained_at - alert_raised_at).'
        mtt_close:
          $ref: '#/components/schemas/ResponseTimeMetric'
          description: 'Mean Time to Close: avg(case_closed_at - alert_raised_at).'
        sla_config:
          $ref: '#/components/schemas/SlaConfig'
          description: SLA targets echoed in response for UI display.
        critical_incident_adherence:
          $ref: '#/components/schemas/SlaAdherenceResult'
          description: SLA adherence for Critical Incident Support (sev=15, target=2hr).
        critical_alert_adherence:
          $ref: '#/components/schemas/SlaAdherenceResult'
          description: SLA adherence for Critical Alert Validation (sev=10, target=4hr).
        non_critical_adherence:
          $ref: '#/components/schemas/SlaAdherenceResult'
