        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization
        schema:
          type: string
      - name: register
        in: query
        description: whether to register the entity again
        schema:
          type: boolean
          default: false
      - name: starting_time
        in: query
        description: Optional unix timestamp (seconds). If provided, only cases created at or after this time will be reindexed.
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: Optional unix timestamp (seconds). If provided, only cases created at or before this time will be reindexed
          (inclusive).
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
