  /alert_skip_list/apply:
    post:
      tags:
      - Alerts
      operationId: applyAlertSkip
      summary: Apply pending alert-skip entries now (admin only)
      description: 'Immediately transitions the named `pending` skip entries to `applied`,

        bypassing the day-7 auto-apply wait. Restricted to admin/super-admin

        callers. Omitting `items` applies every pending entry for the org. The

        action is audited.

        '
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSkipLifecycleRequest'
      responses:
        '200':
          description: Pending skip entries applied successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /alert_skip_list/hold:
    post:
      tags:
      - Alerts
      operationId: holdAlertSkip
      summary: Hold pending alert-skip entries past auto-apply (admin only)
      description: 'Marks the named `pending` skip entries as `held`, preventing the day-7

        auto-apply from promoting them until released. Restricted to

        admin/super-admin callers (a hold is also the contract-override lever).

        The action is audited; `reason` is recorded.

        '
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertSkipLifecycleRequest'
      responses:
        '200':
          description: Skip entries held successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
