            status_v2 takes priority and status is derived from it. For type approval/answer_question, only completed/will_not_do
            may be set directly; customer_action allows all values.
        execution_details:
          $ref: '#/components/schemas/ActionExecutionDetails'
          description: Details of the playbook execution triggered externally for this action; only set when type is approval.
            Set this to record execution_id/started_by when the execution is triggered; the poller updates status_v2/type
            once the execution reaches a terminal state.
