  /v2/query/execute:
    post:
      tags:
      - Query DSL
      operationId: executeQueryAPI
      summary: Execute a DSL query against cases or alerts
      description: 'Executes a custom query using the Query DSL. Results are automatically filtered

        by the user''s accessible organizations. Supports filtering, sorting, pagination,

        and aggregations for dashboard analytics.

        '
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryExecuteRequest'
            examples:
              list_open_cases:
                summary: List open critical cases
                value:
                  collection: cases
                  select:
                  - case_id
                  - name
                  - status
                  - severity
                  - created_at
                  - assignee_name
                  where:
                    status: 0
                    severity:
                      $in:
                      - 0
                      - 1
                  sort:
                    created_at: desc
                  limit: 50
              count_by_status:
                summary: Count cases by status
                value:
                  collection: cases
                  aggregate:
                    group_by:
                    - status
                    metrics:
                      count:
                        $count: true
                  where:
                    created_at:
                      $gte: -30d
              unresolved_alerts:
                summary: Find unresolved alerts by provider
                value:
                  collection: alerts
                  select:
                  - alert_id
                  - alert_type
                  - alert_provider
                  - created_at
                  where:
                    resolved: false
                    alert_provider: crowdstrike
                  sort:
                    created_at: desc
              date_aggregation:
                summary: Cases created per day
                value:
                  collection: cases
                  aggregate:
                    group_by:
                    - date:
                        $dateGroup: created_at
                        unit: day
                    metrics:
                      count:
                        $count: true
                  where:
                    created_at:
                      $gte: -30d
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryExecuteResponse'
              examples:
                list_results:
                  summary: List query results
                  value:
                    data:
                    - case_id: CASE-001
                      name: Phishing attempt detected
                      status: 0
                      severity: 1
                      created_at: 1706745600
                      assignee_name: John Doe
                    - case_id: CASE-002
                      name: Suspicious login activity
                      status: 0
                      severity: 0
                      created_at: 1706659200
                      assignee_name: Jane Smith
                    total: 125
                    limit: 50
                    offset: 0
                    collection: cases
                aggregation_results:
                  summary: Aggregation results
                  value:
                    data:
                    - status: 0
                      count: 45
                    - status: 1
                      count: 30
                    - status: 2
                      count: 50
                    total: 3
                    limit: 100
                    offset: 0
                    collection: cases
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryErrorResponse'
              example:
                message: validation failed
                errors:
                - field: where
                  message: unknown field 'invalid_field' in where clause
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/query/validate:
    post:
      tags:
      - Query DSL
      operationId: validateQueryAPI
      summary: Validate a DSL query without executing it
      description: 'Validates a query against the schema without executing it.

        Useful for checking query syntax before execution.

        '
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryValidateRequest'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryValidateResponse'
              examples:
                valid:
                  summary: Valid query
                  value:
                    valid: true
                    errors: []
                invalid:
                  summary: Invalid query
                  value:
                    valid: false
                    errors:
                    - field: where
                      message: unknown field 'invalid_field' in where clause
                    - field: sort
                      message: field 'non_sortable' is not sortable
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v2/query/schema:
    get:
      tags:
      - Query DSL
      operationId: getQuerySchemaAPI
      summary: Get available query schemas
      description: 'Returns the schema for all queryable collections, including available fields

        and their capabilities (filterable, selectable, sortable, aggregatable).

        '
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuerySchemaResponse'
              example:
                collections:
                  cases:
                    name: cases
                    fields:
                      case_id:
                        type: string
                        filterable: true
                        selectable: true
                        sortable: true
                        aggregatable: false
                      status:
                        type: int
                        filterable: true
                        selectable: true
                        sortable: true
                        aggregatable: true
                      severity:
                        type: int
                        filterable: true
                        selectable: true
                        sortable: true
                        aggregatable: true
                      created_at:
                        type: datetime
                        filterable: true
                        selectable: true
                        sortable: true
                        aggregatable: true
                  alerts:
                    name: alerts
                    fields:
                      alert_id:
                        type: string
                        filterable: true
                        selectable: true
                        sortable: true
                        aggregatable: false
                      alert_type:
                        type: string
                        filterable: true
                        selectable: true
                        sortable: false
                        aggregatable: true
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
