      type: object
      required:
      - risk
      - tag
      - title
      - details
      - footer_label
      - footer_text
      properties:
        risk:
          type: string
          description: Drives the chip color. Accepts color-semantic (info/success/warning/danger, emitted by /query_metrics)
            or severity (Critical/High/Medium/Low/Informational, emitted by the monthly report).
          enum:
          - info
          - success
          - warning
          - danger
          - Critical
          - High
          - Medium
          - Low
          - Informational
          x-enum-varnames:
          - InfoLLMSummaryRisk
          - SuccessLLMSummaryRisk
          - WarningLLMSummaryRisk
          - DangerLLMSummaryRisk
          - CriticalLLMSummaryRisk
          - HighLLMSummaryRisk
          - MediumLLMSummaryRisk
          - LowLLMSummaryRisk
          - InformationalLLMSummaryRisk
        tag:
          type: string
          description: Chip label, e.g. "1 CRITICAL ESCALATION", "TELEMETRY GAP".
        title:
          type: string
          description: a brief summary text of this briefing point in < 10 words
        details:
          type: string
          description: Narrative paragraph describing the briefing point.
        footer_label:
          type: string
          description: Footer flips between a resolved/no-action STATUS line and a NEXT STEP line.
          enum:
          - STATUS
          - NEXT STEP
          x-enum-varnames:
          - StatusLLMSummaryFooter
          - NextStepLLMSummaryFooter
        footer_text:
          type: string
          description: Footer body text for the STATUS / NEXT STEP line.
