  /cost_trim_analysis:
    get:
      tags:
      - Case Manager
      - Dashboard
      operationId: getCostTrimAnalysis
      summary: Retrieve the cost-trim analysis snapshot
      description: 'Returns the latest precomputed alert-type rollup used to surface

        cost-trim opportunities (alert types that produce few or no customer

        escalations). The same base row set is rolled up at request time into

        one of several views (per-org, per-provider, per-type, etc.) so

        dashboards can request exactly the shape they need.


        Efficacy (`escalations / alerts`) is returned per row; bucketing of

        efficacy into named tiers is left to the UI.


        The snapshot is refreshed daily by a background scheduler; the `stale`

        field on the response indicates whether the latest snapshot is older

        than the configured freshness window.

        '
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: view
        in: query
        description: 'Roll-up shape. Defaults to `org_provider_type` (raw rows). Other

          values produce server-side aggregations of the same base rows.

          '
        required: false
        schema:
          type: string
          enum:
          - org_provider_type
          - org_type
          - provider_type
          - org
          - provider
          - type
          - escalations_by_type
          default: org_provider_type
      - name: organization_id
        in: query
        description: 'Restrict the response to the given organization UUIDs. If omitted,

          all organizations the caller has access to via RBAC are included.

          Values are intersected with the accessible set server-side.

          '
        required: false
        schema:
          type: array
          items:
            type: string
        explode: true
      - name: provider
        in: query
        description: Case-insensitive exact-match filter on `alert_provider`.
        required: false
        schema:
          type: string
      - name: alert_type
        in: query
        description: Case-insensitive substring filter on `alert_type`.
        required: false
        schema:
          type: string
      - name: min_alerts
        in: query
        description: Drop rows whose total alert count is below this threshold.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: escalation_thresholds
        in: query
        description: 'Comma-separated list of escalation-rate thresholds (0.0–1.0) used to

          compute the `trim_headroom` columns on the `org` view. Defaults to

          `0,0.05,0.10,0.25`.

          '
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of rows to return.
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 500
      - name: offset
        in: query
        description: Row offset for pagination.
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Cost-trim analysis snapshot fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostTrimAnalysisResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
