    SlaConfig:
      type: object
      description: 'Three SLA tiers. Critical Incident Support (sev=15): 2hr MTTI for true incidents (malware, lateral movement).
        Critical Alert Validation (sev=10): 4hr MTTI for critical alert detection and customer notification. Non-Critical
        (sev≤5): 8hr MTTI for incidents with mitigations in place.'
      properties:
        critical_incident_target_seconds:
          type: integer
          default: 7200
          description: MTTI target for Critical severity (sev=15) true incidents — 2 hr.
        critical_alert_target_seconds:
          type: integer
          default: 14400
          description: MTTI target for High severity (sev=10) alert validation and customer notification — 4 hr.
        non_critical_target_seconds:
          type: integer
          default: 28800
          description: MTTI target for non-critical severity (sev≤5) incidents — 8 hr.
    SlaAdherenceResult:
      type: object
      required:
      - total_cases
      - met_count
      - breach_count
      - adherence_pct
      properties:
        total_cases:
          type: integer
        met_count:
          type: integer
          description: Cases where investigation_completed_metric <= target.
        breach_count:
          type: integer
          description: Cases where investigation_completed_metric > target.
        adherence_pct:
          type: number
          format: float
          description: met_count / total_cases as a percentage.
        avg_mtti_seconds:
          type: integer
          description: Average MTTI across all cases in this tier.
    SlaAdherenceTrendPoint:
      type: object
      required:
      - date
      properties:
        date:
          type: string
          description: Date in YYYY-MM-DD format.
        critical_incident_pct:
          type: number
          format: float
          description: SLA adherence % for Critical Incident Support (sev=15, target=2hr) on this day.
        critical_alert_pct:
          type: number
          format: float
          description: SLA adherence % for Critical Alert Validation (sev=10, target=4hr) on this day.
        non_critical_pct:
          type: number
          format: float
          description: SLA adherence % for Non-Critical Incident Support (sev≤5, target=8hr) on this day.
    PercentileMetric:
      type: object
      properties:
        p50_seconds:
          type: integer
          description: 50th percentile (median) value in seconds.
        p95_seconds:
          type: integer
          description: 95th percentile value in seconds.
        p99_seconds:
          type: integer
          description: 99th percentile value in seconds.
    ResponseTimePercentiles:
      type: object
      properties:
