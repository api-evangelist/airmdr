    post:
      tags:
      - Case Manager Internal
      operationId: reindexAlertsAPI
      summary: Reindex Alerts into Opensearch
      description: Ollivander will be requested to reinsert every Alerts one by one via RabbitMQ queues
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor.
        required: true
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID associated with the requestor.
        required: true
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request
        schema:
          type: string
      - name: Organization-Hosturl
        in: header
        description: The host url of the organization.
        schema:
          type: string
      - name: register
        in: query
        description: whether to register the entity again
        schema:
          type: boolean
          default: false
      - name: starting_time
        in: query
        description: Optional unix timestamp (seconds). If provided, only alerts created at or after this time will be reindexed.
        schema:
          type: integer
          format: int64
      - name: end_time
        in: query
        description: Optional unix timestamp (seconds). If provided, only alerts created at or before this time will be reindexed
          (inclusive).
        schema:
          type: integer
          format: int64
      security:
      - SessionCookie: []
      responses:
        '200':
          description: alerts reindexed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
