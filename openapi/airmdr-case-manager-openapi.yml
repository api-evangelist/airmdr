  /alert_budget_overview:
    get:
      tags:
      - Alerts
      operationId: getAlertBudgetOverview
      summary: Per-organization alert budget vs. actual overview
      description: 'Returns one row per organization the caller can access via RBAC, showing

        the weekly alert budget (`weekly_investigation_limit`) against the actual

        weekly alert volume, whether the org is over budget, and a summary of its

        alert-skip list (how many types are already applied, pending, or awaiting

        approval, plus the next auto-apply date). Powers the overview tab of the

        alert-skip console.


        Actuals are derived from the same daily cost-trim snapshot that backs the

        skip-list detail view, so the two screens reconcile. The `stale` flag

        indicates the snapshot is older than the configured freshness window.

        '
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: organization_id
        in: query
        description: 'The organization (UUID) whose accessible org set the overview is

          computed for. The response includes one row per organization the

          caller can access from this org via RBAC.

          '
        required: true
        schema:
          type: string
      - name: sort_by
        in: query
        required: false
        description: Field to order rows by. Defaults to organization_name.
        schema:
          type: string
          enum:
          - organization_name
          - organization_code
          - actual
          - budget
          - pct_of_budget
          default: organization_name
      - name: sort_order
        in: query
        required: false
        description: Sort direction. Defaults to asc.
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      - name: limit
        in: query
        required: false
        description: Maximum number of org rows to return.
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      - name: offset
        in: query
        required: false
        description: Row offset for pagination.
        schema:
          type: integer
          minimum: 0
          default: 0
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Alert budget overview fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertBudgetOverviewResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /alert_skip_list:
    get:
      tags:
      - Alerts
      operationId: getAlertSkipList
      summary: Retrieve one organization's alert-skip list
      description: 'Returns the organization''s alert types as flat rows, each tagged with a

