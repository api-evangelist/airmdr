          $ref: '#/components/schemas/AssigneeDetails'
          nullable: true
          description: AssigneeDetails for the action; populated alongside assignee during migration
        created_at:
          type: integer
          format: int64
          description: Timestamp of creation of the action.
        modified_at:
          type: integer
          format: int64
          description: Timestamp of the last modification of the action
        completed_at:
          type: integer
          format: int64
          description: Timestamp of the completion of the action
        action_severity:
          $ref: '#/components/schemas/ActionSeverityLevel'
          description: Severity of the action
        session_id:
          type: string
          description: Session ID of the action where execution of the action took place
        required:
          type: boolean
          description: Whether this action is required
        description:
          type: string
          description: Description of the action required
        type:
          type: string
          enum:
          - approval
          - customer_action
          - answer_question
          description: Type of action; null is treated as customer_action
        blocking_reason:
          type: string
          description: Reason this action is blocking the case; only set when type is customer_action
        blocking_fact_id:
          type: string
          description: ID of the fact this action is blocking; only set when type is customer_action
        playbook_id:
          type: string
          description: ID of the playbook associated with this action; only set when type is approval
        priority:
          type: string
          enum:
          - Containment
          - Required
          - Recommended
          description: Priority of the action; when set on create/update, the required flag is derived from it (Containment/Required
            -> true, Recommended -> false)
        evidences:
          type: array
          items:
            type: string
          description: Free-form evidence text snippets associated with the action
        status_v2:
          $ref: '#/components/schemas/ActionStatusV2'
          description: Lifecycle status of the action, kept in sync with status. If both status and status_v2 are set on write,
            status_v2 takes priority and status is derived from it. For type approval/answer_question, only completed/will_not_do
            may be set directly; customer_action allows all values.
        execution_details:
          $ref: '#/components/schemas/ActionExecutionDetails'
          description: Details of the playbook execution triggered externally for this action; only set when type is approval.
            Polled until the execution reaches a terminal state, at which point status_v2/type are updated accordingly.
