          type: boolean
          description: Whether this action is required
        description:
          type: string
          description: Description of the action required
        type:
          type: string
          enum:
          - approval
          - customer_action
          - answer_question
          description: Type of action; null is treated as customer_action
        blocking_reason:
          type: string
          description: Reason this action is blocking the case; only set when type is customer_action
        blocking_fact_id:
          type: string
          description: ID of the fact this action is blocking; only set when type is customer_action
        playbook_id:
          type: string
          description: ID of the playbook associated with this action; only set when type is approval
        priority:
          type: string
          enum:
          - Containment
          - Required
          - Recommended
          description: Priority of the action; when set on create/update, the required flag is derived from it (Containment/Required
