openapi: 3.2.0
info:
  title: User Management Service Organization API
  version: 1.0.0
  description: Endpoints to manage organizations
servers:
- url: /airmdrapi
tags:
- name: Organization
  description: Endpoints to manage organizations
paths:
  /organization:
    post:
      tags:
      - Organization
      operationId: createOrganizationAPI
      summary: create an organization
      description: Creates an organization. This operation can only be performed by a superadmin.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrganizationResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        '409':
          description: conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
      - Organization
      operationId: getOrganizationListAPI
      summary: get list of organizations
      description: Get list of organizations accessible to the logged in user.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: List of organizations retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationListResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organization/filter:
    post:
      tags:
      - Organization
      operationId: filterOrganizationAPI
      summary: filter organizations
      description: Get list of organizations with respect to given filters and accessible to logged in user.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterOrganizationRequest'
      responses:
        '200':
          description: organizations fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOrganizationListResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organization/{organization_identifier}:
    get:
      tags:
      - Organization
      operationId: getOrganizationAPI
      summary: get details of an organization
      description: Get details of an organization.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: organization_identifier
        in: path
        description: The identifier (id or code) of the organization to be fetched
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: organization fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Organization
      operationId: updateOrganizationAPI
      summary: update an organization
      description: Updates an organization. This operation can only be performed by a superadmin.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: organization_identifier
        in: path
        description: The unique identifier (id or code) of the organization
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrganizationResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
      - Organization
      operationId: deleteOrganizationAPI
      summary: delete an organization
      description: Deletes an organization. This operation can only be performed by a superadmin, and a user cannot delete their own organization. Deleting an organization also deletes all descendant organizations, along with their users and user groups.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: organization_identifier
        in: path
        description: The unique identifier (id or code) of the organization
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: organization deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteOrganizationResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organization/logo/upload:
    post:
      tags:
      - Organization
      operationId: uploadOrganizationLogoAPI
      summary: upload logo of an organization
      description: Upload logo of an organization.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  format: binary
                  description: Image of the logo of the organization
                usage_type:
                  $ref: '#/components/schemas/LogoUsageType'
                  description: Logo should be used in Login screen or darryl
      responses:
        '200':
          description: organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadOrganizationLogoResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organization/{organization_identifier}/investigation-configuration:
    get:
      tags:
      - Organization
      operationId: getOrganizationInvestigationConfigurationAPI
      summary: get investigation configuration for an organization
      description: Returns the investigation configuration for the given organization.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: organization_identifier
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier (id or code) of the organization
      - name: include_disabled
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: if true, provider_configs includes all providers and alert types with their enabled state; if false (default), only enabled entries are returned
      security:
      - SessionCookie: []
      responses:
        '200':
          description: investigation configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationInvestigationConfigurationResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organization/{organization_identifier}/credit-context:
    get:
      tags:
      - Organization
      operationId: getOrganizationCreditContextAPI
      summary: get resolved investigation-credit context for an organization
      description: Resolves where the organization's investigation-credit charges are billed. For an org with credit_source "own" (default) it bills itself; for "parent" it walks up the org hierarchy to the nearest ancestor that owns a credit pool and bills that org, surfacing the pool's weekly allocation and this org's optional sub-cap. Used by case-manager to enforce pooled (MSSP) budgets.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: organization_identifier
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier (id or code) of the organization
      security:
      - SessionCookie: []
      responses:
        '200':
          description: credit context resolved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationCreditContextResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organization/{organization_identifier}/features:
    get:
      tags:
      - Organization
      operationId: getOrganizationFeaturesAPI
      summary: get features for an organization
      description: Returns the list of features for the given organization, including whether each feature is enabled/disabled and whether the config is applied at this org level or inherited from a parent organization.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: organization_identifier
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier (id or code) of the organization
      security:
      - SessionCookie: []
      responses:
        '200':
          description: features retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetOrganizationFeaturesResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
      - Organization
      operationId: updateOrganizationFeaturesAPI
      summary: update features for an organization
      description: Updates the enabled/disabled flag for the specified features at the org level. Only features included in the request are modified. Changes are always applied at the specified org level (never to parent).
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: organization_identifier
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier (id or code) of the organization
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationFeaturesRequest'
      responses:
        '200':
          description: features updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateOrganizationFeaturesResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/403Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organization/{organization_identifier}/metabase/restore:
    post:
      tags:
      - Organization
      operationId: restoreMetabaseResourcesAPI
      summary: deletes and recreates metabase resources
      description: Deletes and recreates metabase resources.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      - name: organization_identifier
        in: path
        description: The unique identifier (id or code) of the organization
        required: true
        schema:
          type: string
      security:
      - SessionCookie: []
      responses:
        '200':
          description: metabase resources restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /organization/metabase/session:
    get:
      tags:
      - Organization
      operationId: getMetabaseSessionAPI
      summary: gets metabase session
      description: Gets metabase session.
      parameters:
      - $ref: '#/components/parameters/user-id'
      - $ref: '#/components/parameters/organization-id'
      - $ref: '#/components/parameters/x-request-id'
      security:
      - SessionCookie: []
      responses:
        '200':
          description: metabase session retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMetabaseSessionResponse'
        '403':
          description: forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  schemas:
    CaseFeature:
      type: object
      required:
      - name
      properties:
        name:
          type: string
    OrganizationInvestigationConfiguration:
      type:
      - object
      - 'null'
      description: investigation configuration for the organization
      required:
      - use_shared_playbooks
      properties:
        use_shared_playbooks:
          type: boolean
        weekly_investigation_limit:
          type:
          - integer
          - 'null'
          description: maximum number of investigations allowed per week
        enforce_weekly_investigation_limit:
          type:
          - boolean
          - 'null'
          description: 'whether the weekly investigation limit is enforced as a hard cutoff. Decouples setting the budget number (weekly_investigation_limit) from the blind count-cutoff: when false, the limit is informational (used for reporting/projection) and investigations are not blocked when it is exceeded. Defaults to false for new orgs.'
        weekly_credit_allocation:
          type:
          - integer
          - 'null'
          description: default weekly investigation-credit allocation for the organization
        credit_source:
          $ref: '#/components/schemas/CreditSource'
          description: where the organization's investigation credits are drawn from. "own" (default) uses this org's own weekly_credit_allocation. "parent" draws from the nearest ancestor org that owns a credit pool, in which case weekly_credit_allocation is treated as this org's optional sub-cap within that shared pool.
        investigation_type:
          $ref: '#/components/schemas/OrgInvestigationType'
          description: default investigation type for the organization
          default: playbook
        provider_configs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProviderInvestigationConfig'
          description: per-provider investigation type overrides
        blocked_llm_providers:
          type:
          - array
          - 'null'
          items:
            type: string
          description: list of LLM providers blocked from being used in agentic investigation
    OrganizationFeature:
      type: object
      required:
      - feature_id
      - name
      - enabled
      - config_level
      properties:
        feature_id:
          type: string
          description: The id of the feature
        name:
          type: string
          description: The name of the feature
        description:
          type: string
          description: The description of the feature
        enabled:
          type: boolean
          description: Whether the feature is enabled or disabled
        config_level:
          type: string
          enum:
          - org
          - inherited
          description: 'Whether the feature config is set at this org level ("org") or inherited from a parent organization ("inherited")

            '
        inherited_from_organization_id:
          type: string
          description: 'If config_level is "inherited", the organization_id of the ancestor that defines this feature''s config

            '
    OrganizationMetabaseConfiguration:
      type:
      - object
      - 'null'
      required:
      - enabled
      - dashboards
      properties:
        enabled:
          type: boolean
          description: whether metabase is enabled for the organization
        dashboards:
          type: array
          items:
            $ref: '#/components/schemas/MetabaseDashboard'
          description: list of dashboards enabled
    Adornments:
      type: object
      required:
      - type
      - src
      - size
      properties:
        type:
          type: string
        src:
          type: string
        size:
          type: string
    Success:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: user friendly message
    UpdateOrganizationFeatureItem:
      type: object
      required:
      - feature_id
      - enabled
      properties:
        feature_id:
          type: string
        enabled:
          type: boolean
    OrganizationWithConfiguration:
      type: object
      allOf:
      - $ref: '#/components/schemas/Organization'
      - properties:
          configuration:
            $ref: '#/components/schemas/OrganizationConfiguration'
    CreateOrganizationRequest:
      type: object
      required:
      - name
      - contact_email
      - parent_organization_id
      - can_have_child_organizations
      - rbac_template_id
      properties:
        name:
          type: string
          description: name of the organization
        code:
          type: string
          description: code of the organization
        contact_email:
          type: string
          description: contact email of the organization
        updates_email:
          type: string
          description: email for sending updates to organization's customer
        parent_organization_id:
          type: string
          description: id of the parent organization
        organization_id:
          type: string
          description: id of the organization (used if we want to create an organization with a specific id)
        updates_email_for_escalations_from_parent:
          type: array
          items:
            type: string
          description: list of email addresses to notify when case is escalated from parent organization
        can_have_child_organizations:
          type: boolean
          description: flag indicating whether the new organization can further have child organizations
        parent_has_access_to_descendants:
          type: boolean
          description: whether parent organization has access to descendant organizations of the created organization
        parent_has_access:
          type: boolean
          description: whether parent organization has access to organization's entities. Default is True. If False, parent will also not have access to descendants
        updates_email_for_escalations_from_children:
          type: array
          items:
            type: string
          description: list of email addresses to notify when case is escalated from child organizations
        logo_url:
          type: string
          description: url of the organization's logo
        sso_configuration:
          $ref: '#/components/schemas/OrganizationSSOConfiguration'
        darryl_configuration:
          $ref: '#/components/schemas/OrganizationDarrylConfigurationRequest'
          description: darryl configuration of the organization
        rbac_template_id:
          type: string
          description: id of the rbac template to be used for the organization
        metadata:
          type: object
          description: additional metadata of the organization
          additionalProperties:
            type: string
        investigation_configuration:
          $ref: '#/components/schemas/UpdateOrganizationInvestigationConfigurationRequest'
          description: investigation configuration of the organization
    VisibilitySetting:
      type: string
      enum:
      - full_access
      - no_access
      - org_context_access
      - usage_access
      x-enum-varnames:
      - VisibilityFullAccess
      - VisibilityNoAccess
      - VisibilityOrgContextAccess
      - VisibilityUsageAccess
    CaseCategory:
      type: object
      required:
      - category_name
      properties:
        category_name:
          type: string
        sub_categories:
          type: array
          items:
            $ref: '#/components/schemas/CaseSubCategory'
    PriorityConfig:
      type: object
      required:
      - need_attention_statuses
      - active_statuses
      - closed_statuses
      properties:
        need_attention_statuses:
          description: list of statuses that will be shown in Need attention tab
          type: array
          items:
            type: integer
        active_statuses:
          description: list of statuses that will be shown in Active tab
          type: array
          items:
            type: integer
        closed_statuses:
          description: list of statuses that will be shown in Closed tab
          type: array
          items:
            type: integer
    CaseSubCategory:
      type: object
      required:
      - sub_category_name
      properties:
        sub_category_name:
          type: string
    OrgInvestigationType:
      type: string
      enum:
      - agentic
      - agentic_preview
      - playbook
      description: 'Investigation type for the organization. agentic: agentic investigation only, creates case. agentic_preview: both agentic and playbook run; playbook creates case. playbook: playbook investigation only.

        '
    AirMDRFeature:
      type: object
      required:
      - feature_id
      - name
      properties:
        feature_id:
          type: string
          description: The id of the feature
        name:
          type: string
          description: The name of the feature
        description:
          type: string
          description: The description of the feature
    ConfigSource:
      type: string
      enum:
      - parent
      - new
      x-enum-varnames:
      - ConfigSourceParent
      - ConfigSourceNew
    GetOrganizationCreditContextResponse:
      type: object
      required:
      - data
      - message
      properties:
        data:
          $ref: '#/components/schemas/CreditContext'
        message:
          type: string
    GetOrganizationInvestigationConfigurationResponse:
      type: object
      required:
      - data
      - message
      properties:
        data:
          $ref: '#/components/schemas/OrganizationInvestigationConfiguration'
        message:
          type: string
    OrganizationSSOConfiguration:
      type:
      - object
      - 'null'
      description: sso configuration set for the organization
      required:
      - sso_config_source
      properties:
        sso_config_source:
          $ref: '#/components/schemas/SSOConfigSource'
        identity_provider_name:
          type: string
          description: the name of the identity provider
        entity_id:
          type: string
          description: the entity id or the issuer id
        certificate:
          type: string
          description: public certificate of the identity provider
        sso_url:
          type: string
          description: the sso url of the identity provider
        logout_url:
          type: string
          description: the logout url of the identity provider
    UploadOrganizationLogoResponse:
      type: object
      required:
      - data
      - message
      properties:
        message:
          type: string
