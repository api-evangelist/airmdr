    UpdateOrganizationInvestigationConfigurationRequest:
      type:
      - object
      - 'null'
      description: investigation configuration update request
      properties:
        use_shared_playbooks:
          type:
          - boolean
          - 'null'
          description: whether shared playbooks are used for investigation
        weekly_investigation_limit:
          type:
          - integer
          - 'null'
          description: maximum number of investigations allowed per week
        enforce_weekly_investigation_limit:
          type:
          - boolean
          - 'null'
          description: 'whether the weekly investigation limit is enforced as a hard cutoff. Decouples setting the budget number (weekly_investigation_limit) from the blind count-cutoff: when false, the limit is informational (used for reporting/projection) and investigations are not blocked when it is exceeded. Defaults to false for new orgs.'
        weekly_credit_allocation:
          type:
          - integer
          - 'null'
          description: default weekly investigation-credit allocation for the organization
        credit_source:
          $ref: '#/components/schemas/CreditSource'
          description: where the organization's investigation credits are drawn from. "own" (default) uses this org's own weekly_credit_allocation. "parent" draws from the nearest ancestor org that owns a credit pool, in which case weekly_credit_allocation is treated as this org's optional sub-cap within that shared pool.
        investigation_type:
          $ref: '#/components/schemas/OrgInvestigationType'
          description: default investigation type for the organization
          default: playbook
        provider_configs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ProviderInvestigationConfig'
          description: per-provider investigation type overrides
        blocked_llm_providers:
          type:
          - array
          - 'null'
          items:
            type: string
          description: list of LLM providers blocked from being used in agentic investigation
