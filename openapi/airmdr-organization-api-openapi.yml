    CreditContext:
      type: object
      description: 'Resolved investigation-credit context for an organization: which org''s balance its charges debit (itself for own; the nearest ancestor pool owner for parent), the pool''s weekly allocation, and this org''s optional sub-cap within the pool.

        '
      required:
      - organization_id
      - credit_source
      - billing_organization_id
      - billing_organization_code
      - enforced
      properties:
        organization_id:
          type: string
          description: the organization this context was resolved for
        credit_source:
          $ref: '#/components/schemas/CreditSource'
          description: the org's effective credit source (own if unset)
        billing_organization_id:
          type: string
          description: id of the org whose credit balance charges debit (self for own; the pool owner for parent)
        billing_organization_code:
          type: string
          description: code of the billing org (used as the credit-balance key in case-manager)
        pool_weekly_allocation:
          type:
          - integer
          - 'null'
          description: weekly credit allocation of the billing org (the shared pool size); null/unset means unlimited
        child_sub_cap:
          type:
          - integer
          - 'null'
          description: 'this org''s optional weekly sub-cap within the shared pool (only set when credit_source is parent and the child has its own weekly_credit_allocation)

            '
        enforced:
          type: boolean
          description: 'false when no ancestor pool was found and no own allocation is set, i.e. charges are unlimited (still recorded for reporting)

            '
