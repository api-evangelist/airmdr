openapi: 3.2.0
info:
  title: Airmdr Trial API
  version: 1.0.0
  x-refined-note:
  - x-generated-from differs across the merged source definitions and was not carried
  description: 'Operations tagged Trial across 2 of this provider''s published API definitions: airmdr-user-management-service-openapi.json, airmdr-user-management-service-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /airmdrapi
- url: https://app.airmdr.com/airmdrapi
  description: AirMDR API (relative /airmdrapi in the published spec, resolved against app.airmdr.com per docs.airmdr.com/api-reference/apitoken)
tags:
- name: Trial
paths:
  /trial/register:
    post:
      tags:
      - Trial
      operationId: registerTrialAPI
      summary: register trial
      description: Registers a trial account.
      parameters:
      - name: User-ID
        in: header
        description: The User ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: Organization-ID
        in: header
        description: The Organization ID of the requestor. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      - name: X-Request-ID
        in: header
        description: The ID associated with the request. If requests are made through API Gateway, this header will be pre filled.
        schema:
          type: string
      security:
      - SessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTrialRequest'
      responses:
        '200':
          description: trial registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterTrialResponse'
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    servers:
    - url: /airmdrapi
components:
  schemas:
    RegisterTrialRequest:
      type: object
      required:
      - email
      - trail_feature
      properties:
        email:
          type: string
        trail_feature:
          $ref: '#/components/schemas/TrialFeature'
    TrialFeature:
      type: string
      enum:
      - alert_catalog
      x-enum-varnames:
      - TrialFeatureAlertCatalog
    Error:
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: user friendly error message
    RegisterTrialResponse:
      type: object
      required:
      - message
      - data
      properties:
        message:
          type: string
        data:
          type: object
          properties:
            trail_link:
              type: string
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: Session
x-refined-from:
- airmdr-user-management-service-openapi.json
- airmdr-user-management-service-openapi.yml
x-tagGroups:
- name: Included APIs
  tags:
  - Case Manager V2
  - Dashboard
  - Alerts
  - Webhooks
  - Query DSL
